<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>かんじ けいさん</title>
<style>
  :root {
    --bg: #fff8e1; --ink: #3e2723; --card: #ffffff; --main: #ff8f00;
    --ok: #43a047; --ng: #e53935; --soft: #ffe0b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 4px 0; font-size: 1.6rem; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 var(--soft); }
  .big-btn { font: inherit; font-size: 1.6rem; border: 0; border-radius: 18px; padding: 16px 20px;
    background: var(--main); color: #fff; box-shadow: 0 5px 0 #c66900; cursor: pointer; width: 100%; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c66900; }
  .big-btn.sub { background: #8d6e63; box-shadow: 0 5px 0 #5d4037; font-size: 1.2rem; }
  .tabs { display: flex; gap: 8px; }
  .tab { font: inherit; font-size: 1.1rem; padding: 10px 4px; border: 3px solid var(--soft);
    border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .tab.on { background: var(--main); border-color: var(--main); color: #fff; }
  .pet { text-align: center; font-size: 1rem; }
  .pet .e { font-size: 2.6rem; display: block; line-height: 1.1; }
  .pic { font-size: 4.2rem; line-height: 1; }
  .morph { animation: morph 1s ease-in-out; }
  @keyframes morph { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(.2) rotate(180deg); opacity: 0; }
    55% { transform: scale(.2) rotate(180deg); opacity: 0; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
  .choice.txt .k { font-size: 2rem; padding: 10px 0; }
  .tabs { flex-wrap: wrap; }
  .tab { flex: 1 1 45%; }
  .hidden { display: none !important; }

  /* mondai */
  #formula { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  .num { text-align: center; }
  .num .k { font-size: 4.2rem; line-height: 1; }
  .num .r { font-size: .95rem; color: #8d6e63; }
  .op { font-size: 3rem; }
  .q { font-size: 4.2rem; color: var(--main); }
  #hint { text-align: center; font-size: 1.1rem; min-height: 1.6em; }
  #choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choice { font: inherit; background: #fff; border: 4px solid var(--soft); border-radius: 18px;
    padding: 6px 0; cursor: pointer; text-align: center; }
  .choice .k { font-size: 3rem; display: block; line-height: 1.1; }
  .choice .r { font-size: .85rem; color: #8d6e63; }
  .choice.ok { border-color: var(--ok); background: #e8f5e9; }
  .choice.ng { border-color: var(--ng); background: #ffebee; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* nazori */
  #traceMsg { text-align: center; font-size: 1.2rem; margin: 0 0 8px; }
  #pad { position: relative; width: 100%; aspect-ratio: 1; border: 4px dashed var(--soft); border-radius: 16px; background: #fffdf7; }
  #guide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: min(70vw, 340px); color: #e0d6cf; user-select: none; pointer-events: none; line-height: 1; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .row { display: flex; gap: 10px; margin-top: 10px; }

  /* zukan */
  #zukan { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .z { text-align: center; border-radius: 12px; padding: 4px 0; background: #eee; color: #bbb; }
  .z .k { font-size: 1.8rem; line-height: 1.1; display: block; }
  .z .r { font-size: .7rem; }
  .z.got { background: #fff3c4; color: var(--ink); }
  .z .c { font-size: .7rem; }

  #cheer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 4rem; pointer-events: none; opacity: 0; }
  #cheer.show { animation: pop 1s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.2); }
    80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
</style>
</head>
<body>
<div id="app">
  <h1>かんじ けいさん</h1>
  <div class="bar"><span>⭐ <b id="stars">0</b></span><span>ずかん <b id="gotCount">0</b>/<span id="totalCount">30</span></span></div>
  <div class="pet"><span class="e" id="petE"></span><span id="petT"></span></div>
  <div class="tabs">
    <button id="tabCalc" class="tab">🔢 けいさん</button>
    <button id="tabOpp" class="tab">↔ はんたいことば</button>
    <button id="tabNat" class="tab">🌳 しぜんの かんじ</button>
    <button id="tabRead" class="tab">📖 よみクイズ</button>
  </div>

  <!-- もんだい -->
  <section id="quiz" class="card">
    <div id="formula"></div>
    <p id="hint"></p>
    <div id="choices"></div>
  </section>

  <!-- なぞりがき -->
  <section id="trace" class="card hidden">
    <p id="traceMsg"></p>
    <div id="pad"><div id="guide"></div><canvas id="cv"></canvas></div>
    <div class="row">
      <button class="big-btn sub" id="clearBtn">けす</button>
      <button class="big-btn" id="doneBtn">できた!</button>
    </div>
  </section>

  <!-- ずかん -->
  <section class="card">
    <div style="text-align:center;margin-bottom:6px">かんじずかん</div>
    <div id="zukan"></div>
  </section>
</div>
<div id="cheer"></div>

<script>
const KANJI = [
  { n: 1, k: "一", r: "いち" }, { n: 2, k: "二", r: "に" }, { n: 3, k: "三", r: "さん" },
  { n: 4, k: "四", r: "よん" }, { n: 5, k: "五", r: "ご" }, { n: 6, k: "六", r: "ろく" },
  { n: 7, k: "七", r: "なな" }, { n: 8, k: "八", r: "はち" }, { n: 9, k: "九", r: "きゅう" },
  { n: 10, k: "十", r: "じゅう" },
];
// はんたいことば: 奇数番号とその次の番号がペア(11↔12, 13↔14 ...)
const OPP = [
  { n: 11, k: "上", r: "うえ" }, { n: 12, k: "下", r: "した" },
  { n: 13, k: "大", r: "おおきい" }, { n: 14, k: "小", r: "ちいさい" },
  { n: 15, k: "左", r: "ひだり" }, { n: 16, k: "右", r: "みぎ" },
  { n: 17, k: "入", r: "いる" }, { n: 18, k: "出", r: "でる" },
  { n: 19, k: "男", r: "おとこ" }, { n: 20, k: "女", r: "おんな" },
];
// しぜんの漢字: 絵(emoji)が漢字に変身する
const NAT = [
  { n: 21, k: "日", r: "ひ", e: "☀️" }, { n: 22, k: "月", r: "つき", e: "🌙" },
  { n: 23, k: "火", r: "か", e: "🔥" }, { n: 24, k: "水", r: "みず", e: "💧" },
  { n: 25, k: "木", r: "き", e: "🌳" }, { n: 26, k: "山", r: "やま", e: "⛰️" },
  { n: 27, k: "川", r: "かわ", e: "🏞️" }, { n: 28, k: "田", r: "た", e: "🌾" },
  { n: 29, k: "石", r: "いし", e: "🪨" }, { n: 30, k: "雨", r: "あめ", e: "🌧️" },
];
const ALL = KANJI.concat(OPP, NAT);
const TOTAL = ALL.length;
const byN = n => ALL[n - 1];
const STAGES = [
  { at: 0, e: "🥚", name: "たまご" }, { at: 4, e: "🐣", name: "ひよこ" },
  { at: 8, e: "🐥", name: "こどり" }, { at: 13, e: "🐔", name: "にわとり" },
  { at: 18, e: "🦜", name: "おうむ" }, { at: 23, e: "🦚", name: "くじゃく" },
  { at: 27, e: "🐉", name: "ドラゴン" }, { at: 30, e: "🦄", name: "でんせつ" },
];
const stageIdx = c => STAGES.reduce((i, st, j) => (c >= st.at ? j : i), 0);
const partner = n => (n % 2 === 1 ? n + 1 : n - 1);

// ---- 保存(使えない環境でも動くように try/catch) ----
function load() {
  try { return JSON.parse(localStorage.getItem("kanjiTashizan") || "null") || {}; } catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem("kanjiTashizan", JSON.stringify(state)); } catch (e) {}
}
const state = Object.assign({ stars: 0, got: {}, miss: {}, mode: "calc" }, load());

// ---- 音 ----
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
function cheer(text) {
  const c = document.getElementById("cheer");
  c.textContent = text; c.classList.remove("show"); void c.offsetWidth; c.classList.add("show");
}

const $ = id => document.getElementById(id);
let cur = null;      // { a, b, ans }
let locked = false;

// 苦手な答えが出やすくなる重み付き抽選
function weighted(pool) {
  let x = Math.random() * pool.reduce((t, q) => t + q.w, 0);
  for (const q of pool) { x -= q.w; if (x <= 0) return q; }
  return pool[0];
}
function pickQuestion() {
  if (state.mode === "nat" || state.mode === "read") {
    const src = state.mode === "nat" ? NAT : ALL;
    return weighted(src.map(d => ({ a: d.n, ans: d.n, mode: state.mode, w: 1 + (state.miss[d.n] || 0) * 2 })));
  }
  if (state.mode === "opp") {
    const pool = OPP.map(d => ({ a: d.n, ans: partner(d.n), mode: "opp", w: 1 + (state.miss[partner(d.n)] || 0) * 2 }));
    let x = Math.random() * pool.reduce((t, q) => t + q.w, 0);
    for (const q of pool) { x -= q.w; if (x <= 0) return q; }
    return pool[0];
  }
  const pool = [];
  for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++) {
    const ans = a + b;
    pool.push({ a, b, ans, op: "+", w: 1 + (state.miss[ans] || 0) * 2 });
  }
  for (let a = 2; a <= 10; a++) for (let b = 1; b < a; b++) {
    const ans = a - b;
    pool.push({ a, b, ans, op: "-", w: 1 + (state.miss[ans] || 0) * 2 });
  }
  let total = pool.reduce((s, p) => s + p.w, 0), x = Math.random() * total;
  for (const p of pool) { x -= p.w; if (x <= 0) return p; }
  return pool[0];
}

function renderZukan() {
  $("zukan").innerHTML = ALL.map(d => {
    const g = state.got[d.n];
    return `<div class="z ${g ? "got" : ""}"><span class="k">${g ? d.k : "?"}</span><span class="r">${g ? d.r : ""}</span>${g ? `<span class="c">×${g}</span>` : ""}</div>`;
  }).join("");
  $("gotCount").textContent = Object.keys(state.got).length;
  $("totalCount").textContent = TOTAL;
  const c = Object.keys(state.got).length, si = stageIdx(c), st = STAGES[si], nx = STAGES[si + 1];
  $("petE").textContent = st.e;
  $("petT").textContent = nx ? `${st.name}(つぎの しんかまで あと ${nx.at - c}こ)` : `${st.name}(さいきょう!)`;
  $("tabCalc").classList.toggle("on", state.mode === "calc");
  $("tabOpp").classList.toggle("on", state.mode === "opp");
  $("tabNat").classList.toggle("on", state.mode === "nat");
  $("tabRead").classList.toggle("on", state.mode === "read");
  $("stars").textContent = state.stars;
}

function numHtml(n) {
  const d = byN(n);
  return `<div class="num"><div class="k">${d.k}</div><div class="r">${d.r}</div></div>`;
}

function newQuestion() {
  locked = false;
  cur = pickQuestion();
  const opp = cur.mode === "opp", nat = cur.mode === "nat", rd = cur.mode === "read";
  const lo = opp ? 11 : nat ? 21 : rd ? 1 : 1, hi = opp ? 20 : nat ? 30 : rd ? 30 : 10;
  if (nat) {
    $("formula").innerHTML = `<span class="pic" id="pic">${byN(cur.a).e}</span><span class="op">=</span><span class="q">?</span>`;
    $("hint").textContent = "この え は どの かんじかな?";
  } else if (rd) {
    $("formula").innerHTML = `<div class="num"><div class="k" style="font-size:5rem">${byN(cur.a).k}</div></div>`;
    $("hint").textContent = "なんて よむのかな?";
  } else if (opp) {
    $("formula").innerHTML = numHtml(cur.a) + `<span class="op">↔</span><span class="q">?</span>`;
    $("hint").textContent = "はんたいの かんじは どれかな?";
  } else {
    $("formula").innerHTML = numHtml(cur.a) + `<span class="op">${cur.op === "+" ? "+" : "−"}</span>` + numHtml(cur.b) + `<span class="op">=</span><span class="q">?</span>`;
    $("hint").textContent = "こたえの かんじは どれかな?";
  }
  // 選択肢: 正解 + ダミー2つ
  const set = new Set([cur.ans]);
  while (set.size < 3) {
    const n = lo + Math.floor(Math.random() * (hi - lo + 1));
    if (rd && byN(n).r === byN(cur.ans).r) continue; // おなじ よみは まぜない
    set.add(n);
  }
  const arr = [...set].sort(() => Math.random() - 0.5);
  $("choices").innerHTML = arr.map(n => {
    const d = byN(n);
    if (rd) return `<button class="choice txt" data-n="${n}"><span class="k">${d.r}</span></button>`;
    if (nat) return `<button class="choice" data-n="${n}"><span class="k">${d.k}</span></button>`;
    return `<button class="choice" data-n="${n}"><span class="k">${d.k}</span><span class="r">${d.r}</span></button>`;
  }).join("");
  $("quiz").classList.remove("hidden");
  $("trace").classList.add("hidden");
  speak(rd ? `${byN(cur.a).k} は なんと よむ?` : nat ? "この え は どの かんじ?" : opp ? `${byN(cur.a).r} の はんたいは?` : `${byN(cur.a).r} ${cur.op === "+" ? "たす" : "ひく"} ${byN(cur.b).r} は?`);
}

$("choices").addEventListener("click", e => {
  const btn = e.target.closest(".choice");
  if (!btn || locked) return;
  const n = +btn.dataset.n;
  if (n === cur.ans) {
    locked = true;
    btn.classList.add("ok");
    $("hint").textContent = `せいかい! ${byN(n).k} は「${byN(n).r}」`;
    speak(byN(n).r);
    cheer("🎉");
    if (cur.mode === "nat") {
      const pic = $("pic");
      pic.classList.add("morph");
      setTimeout(() => { pic.textContent = byN(n).k; }, 500);
    }
    setTimeout(startTrace, 1300);
  } else {
    btn.classList.add("ng");
    state.miss[cur.ans] = (state.miss[cur.ans] || 0) + 1; save();
    $("hint").textContent = "おしい! もういっかい!";
  }
});

// ---- なぞりがき ----
const cv = $("cv"), ctx = cv.getContext("2d");
let drawing = false, last = null, inked = 0;

function sizeCanvas() {
  const r = $("pad").getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 14; ctx.strokeStyle = "#ff6f00";
}
function startTrace() {
  const d = byN(cur.ans);
  $("quiz").classList.add("hidden");
  $("trace").classList.remove("hidden");
  $("guide").textContent = d.k;
  $("traceMsg").textContent = `「${d.k}」を なぞってみよう`;
  sizeCanvas(); inked = 0;
}
function pos(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener("pointerdown", e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!drawing) return;
  const p = pos(e);
  ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  inked += Math.hypot(p.x - last.x, p.y - last.y);
  last = p;
});
["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
$("clearBtn").addEventListener("click", () => { ctx.clearRect(0, 0, cv.width, cv.height); inked = 0; });
$("doneBtn").addEventListener("click", () => {
  if (inked < 60) { $("traceMsg").textContent = "ゆびで なぞってね!"; return; }
  const n = cur.ans;
  const before = stageIdx(Object.keys(state.got).length);
  state.got[n] = (state.got[n] || 0) + 1;
  const evolved = stageIdx(Object.keys(state.got).length) > before;
  state.stars += 1;
  if (state.miss[n]) state.miss[n] = Math.max(0, state.miss[n] - 1);
  save(); renderZukan();
  cheer(Object.keys(state.got).length === TOTAL && state.got[n] === 1 ? "🏆 ぜんぶ そろった!"
    : evolved ? `${STAGES[stageIdx(Object.keys(state.got).length)].e} しんか!` : "⭐");
  if (evolved) speak("しんか!");
  setTimeout(newQuestion, 900);
});

window.addEventListener("resize", () => { if (!$("trace").classList.contains("hidden")) sizeCanvas(); });

function setMode(m) { state.mode = m; save(); renderZukan(); newQuestion(); }
$("tabCalc").addEventListener("click", () => setMode("calc"));
$("tabOpp").addEventListener("click", () => setMode("opp"));
$("tabNat").addEventListener("click", () => setMode("nat"));
$("tabRead").addEventListener("click", () => setMode("read"));

renderZukan();
newQuestion();
</script>
</body>
</html>
