<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<!--pwa--><link rel="manifest" href="manifest.webmanifest">
<!--pwa--><link rel="apple-touch-icon" href="icon-180.png">
<!--pwa--><meta name="apple-mobile-web-app-capable" content="yes">
<!--pwa--><meta name="mobile-web-app-capable" content="yes">
<!--pwa--><meta name="apple-mobile-web-app-title" content="かんじ">
<!--pwa--><meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>かんじ けいさん</title>
<style>
  :root {
    --bg: #fff8e1; --ink: #3e2723; --card: #ffffff; --main: #ff8f00;
    --ok: #43a047; --ng: #e53935; --soft: #ffe0b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  @media (display-mode: standalone) {      /* ホーム画面から ひらいた とき(ノッチを さける) */
    #app { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  }
  h1 { margin: 4px 0; font-size: 1.6rem; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 var(--soft); }
  .big-btn { font: inherit; font-size: 1.6rem; border: 0; border-radius: 18px; padding: 16px 20px;
    background: var(--main); color: #fff; box-shadow: 0 5px 0 #c66900; cursor: pointer; width: 100%; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c66900; }
  .big-btn.sub { background: #8d6e63; box-shadow: 0 5px 0 #5d4037; font-size: 1.2rem; }
  .tabs { display: flex; gap: 8px; }
  .tab { font: inherit; font-size: 1.1rem; padding: 10px 4px; border: 3px solid var(--soft);
    border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .tab.on { background: var(--main); border-color: var(--main); color: #fff; }
  .pet { text-align: center; font-size: 1rem; }
  .pet .e { font-size: 2.6rem; display: block; line-height: 1.1; }
  .pic { font-size: 4.2rem; line-height: 1; }
  .morph { animation: morph 1s ease-in-out; }
  @keyframes morph { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(.2) rotate(180deg); opacity: 0; }
    55% { transform: scale(.2) rotate(180deg); opacity: 0; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
  .choice.txt .k { font-size: 2rem; padding: 10px 0; }
  .tabs { flex-wrap: wrap; }
  .tab { flex: 1 1 45%; }
  .hidden { display: none !important; }

  /* mondai */
  #formula { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  .num { text-align: center; }
  .num .k { font-size: 4.2rem; line-height: 1; }
  .num .r { font-size: .95rem; color: #8d6e63; }
  .op { font-size: 3rem; }
  .q { font-size: 4.2rem; color: var(--main); }
  #hint { text-align: center; font-size: 1.1rem; min-height: 1.6em; }
  #choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choice { font: inherit; background: #fff; border: 4px solid var(--soft); border-radius: 18px;
    padding: 6px 0; cursor: pointer; text-align: center; }
  .choice .k { font-size: 3rem; display: block; line-height: 1.1; }
  .choice .r { font-size: .85rem; color: #8d6e63; }
  .choice.ok { border-color: var(--ok); background: #e8f5e9; }
  .choice.ng { border-color: var(--ng); background: #ffebee; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* nazori */
  #traceMsg { text-align: center; font-size: 1.2rem; margin: 0 0 8px; }
  #pad { position: relative; width: 100%; aspect-ratio: 1; border: 4px dashed var(--soft); border-radius: 16px; background: #fffdf7; }
  #sv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #sv path, #sv polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ghost { stroke: #e6dcd5; stroke-width: 6; }
  .done { stroke: #ff8f00; stroke-width: 6; }
  .demo { stroke: #1e88e5; stroke-width: 6; }
  .user { stroke: #1e88e5; stroke-width: 5; opacity: .85; }
  .user.bad { stroke: #e53935; transition: opacity .6s; opacity: 0; }
  .startdot { fill: #1e88e5; animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .startnum { fill: #fff; font-size: 7px; font-weight: bold; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  @keyframes pulse { 50% { transform: scale(1.35); } }
  .opt { display: block; margin: 8px 0; font-size: 1rem; }
  .opt label { margin-right: 8px; }
  .endtag { font-size: 5px; font-weight: bold; fill: #1e88e5; paint-order: stroke; stroke: #fffdf7; stroke-width: 1.2px; }
  #dbg { font: 11px/1.4 monospace; color: #6d4c41; white-space: pre-wrap; margin-top: 8px; }
  #learn { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    background: #fff3e0; border: 3px dashed var(--main); border-radius: 16px; padding: 8px 12px; margin-bottom: 8px; }
  #learn .lk { font-size: 3rem; line-height: 1; }
  #learn .lr { font-size: 1.3rem; font-weight: bold; }
  #learn .lx { font-size: 1rem; color: #8d6e63; width: 100%; text-align: center; }
  .z.rv { background: #fff0e0; color: #c98a45; outline: 2px dashed var(--main); outline-offset: -2px; }
  .z.rv .k { opacity: .75; }
  #rvLine { text-align: center; font-size: .95rem; color: #c66900; }
  .sent { font-size: 1.7rem; line-height: 1.6; text-align: center; padding: 8px 0; }
  .blank { display: inline-block; min-width: 1.6em; color: var(--main); border-bottom: 4px solid var(--main); }
  .strip { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 1.05rem; min-height: 1.4em; }
  .strip b { color: #c66900; }
  #daily { padding: 10px 14px; }
  #daily h3, #rewards h3 { margin: 0 0 6px; font-size: 1rem; }
  .ms { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: .95rem; }
  .ms .bar2 { flex: 1; height: 8px; background: #eee; border-radius: 6px; overflow: hidden; min-width: 40px; }
  .ms .bar2 i { display: block; height: 100%; background: var(--main); }
  .ms.done { color: #43a047; } .ms.done .bar2 i { background: #43a047; }
  .rtabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .rtabs .tab { flex: 1; font-size: 1rem; padding: 8px; }
  #bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bd { text-align: center; background: #fff3c4; border-radius: 12px; padding: 6px 2px; font-size: .7rem; line-height: 1.25; }
  .bd .be { font-size: 1.7rem; display: block; }
  .bd.lock { background: #eee; color: #aaa; } .bd.lock .be { filter: grayscale(1); opacity: .35; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--soft); }
  .item .ie { font-size: 1.8rem; width: 2.2rem; text-align: center; }
  .item .in { flex: 1; font-size: .95rem; }
  .item button { font: inherit; font-size: .95rem; padding: 6px 12px; border: 0; border-radius: 12px; background: var(--main); color: #fff; cursor: pointer; }
  .item button.off { background: #bdbdbd; } .item button.on { background: #43a047; }
  .petwrap { position: relative; display: inline-block; }
  .acc { position: absolute; font-size: 1.15rem; line-height: 1; pointer-events: none; }
  .acc.head { top: -.45rem; left: 50%; transform: translateX(-50%); }
  .acc.face { top: 1.15rem; left: 50%; transform: translateX(-50%); }
  .acc.neck { bottom: -.15rem; left: 50%; transform: translateX(-50%); }
  .acc.side { right: -1.1rem; bottom: .1rem; }
  #toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 20;
    background: #3e2723; color: #fff8e1; padding: 10px 16px; border-radius: 14px; font-size: 1rem; max-width: 92vw; text-align: center; box-shadow: 0 4px 12px #0004; }
  #town h3 { margin: 0; font-size: 1.05rem; }
  .thead > div:first-child { min-width: 0; }
  .thead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .tsub { font-size: .85rem; color: #8d6e63; }
  .tchest { flex: none; white-space: nowrap; border: 0; background: #fff3c4; border-radius: 14px; padding: 4px 10px; font: inherit; font-size: .9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .tchest img { width: 34px; height: 34px; object-fit: contain; }
  .tchest.ready { animation: pulse2 1.2s ease-in-out infinite; background: #ffe082; }
  .tchest.done { opacity: .55; }
  @keyframes pulse2 { 50% { transform: scale(1.07); } }
  .crew { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .crew button { border: 0; background: #f1f8e9; border-radius: 12px; padding: 2px; width: 44px; height: 44px; cursor: pointer; }
  .crew button img { width: 100%; height: 100%; object-fit: contain; }
  .crew button.lock { background: #eee; font-size: 1rem; color: #aaa; }
  .crew button.hop img { animation: hop .5s ease-out; }
  @keyframes hop { 40% { transform: translateY(-10px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
  .tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tcell { background: linear-gradient(#eaf6dc, #d3eab8); border: 3px solid transparent; border-radius: 14px; padding: 4px 2px 4px; text-align: center; cursor: pointer;
    font: inherit; font-size: .78rem; color: var(--ink); min-width: 0; }
  .tcell img { display: block; width: 100%; height: 86px; object-fit: contain; margin: 0 auto 2px; pointer-events: none; }
  .tcell { position: relative; }
  .tcell.sel { border-color: var(--main); }
  .tcell.pop img { animation: pop2 .7s ease-out; }
  @keyframes pop2 { 0% { transform: scale(.3); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .tcell.add { background: #fff8e1; border: 3px dashed var(--main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 118px; color: #c66900; font-size: .95rem; }
  .tcell.add .plus { font-size: 2rem; line-height: 1; }
  .tlv { color: #c66900; font-weight: bold; }
  .tpanel { margin-top: 10px; background: #fffdf4; border: 2px solid var(--soft); border-radius: 14px; padding: 10px; }
  .tpanel .big { display: flex; gap: 12px; align-items: center; }
  .tpanel .big > img { width: 38%; max-width: 150px; height: auto; object-fit: contain; }
  .tpanel .info { flex: 1; min-width: 0; }
  .tpanel .nm { font-size: 1.15rem; font-weight: bold; }
  .tbtn { white-space: nowrap; font: inherit; font-size: .92rem; border: 0; border-radius: 12px; padding: 8px 14px; background: var(--main); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
  .tbtn.off { background: #bdbdbd; }
  .tbtn img { width: 20px; height: 20px; }
  .tchip { display: inline-block; background: #fff3c4; border-radius: 10px; padding: 0 8px; margin-right: 4px; font-size: .95rem; }
  .blist .bi { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--soft); }
  .blist .bi img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .blist .bi.lock img { filter: grayscale(1) brightness(.9); opacity: .45; }
  .blist .bi .tx { flex: 1; min-width: 0; font-size: .92rem; }
  .blist .bi.lock .tx { color: #9e9e9e; }
  .newdot { display: inline-block; background: #e53935; color: #fff; border-radius: 10px; font-size: .7rem; padding: 0 6px; margin-left: 4px; vertical-align: middle; }
  body { padding-bottom: 0; }
  #app { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  .screen { display: none; flex-direction: column; gap: 12px; }
  .screen.on { display: flex; }
  #top { display: flex; align-items: center; gap: 8px; }
  #top .ttl { flex: 1; font-size: 1.15rem; }
  #top .coins { display: flex; align-items: center; gap: 4px; background: #fff3c4; border-radius: 14px; padding: 2px 10px; font-size: 1.05rem; }
  #top .coins img { width: 22px; height: 22px; }
  .ibtn { font-size: 1.3rem; border: 0; background: none; cursor: pointer; padding: 4px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 1.05rem; }
  .hero { text-align: center; padding: 12px; }
  .hero .pet .e { font-size: 3.2rem; }
  .cta { font-size: 1.5rem; padding: 18px 20px; }
  .quick { font-size: 1.05rem; padding: 12px 16px; }
  .homeTown { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; padding: 10px 14px; }
  .homeTown img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .homeTown .tx { flex: 1; min-width: 0; }
  .homeTown .tx small { color: #8d6e63; display: block; }
  .sh { margin: 4px 0 0; font-size: 1.1rem; }
  #modeGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mcard { font: inherit; color: var(--ink); background: #fff; border: 4px solid var(--soft); border-radius: 18px; padding: 10px 8px; text-align: center; cursor: pointer; min-width: 0; position: relative; }
  .mcard .me { font-size: 2.2rem; display: block; line-height: 1.2; }
  .mcard .mn { font-weight: bold; font-size: 1rem; display: block; }
  .mcard .md { font-size: .78rem; color: #8d6e63; display: block; margin-top: 2px; }
  .mcard.on { border-color: var(--main); background: #fff3c4; }
  .mcard .rec { position: absolute; top: -9px; right: 8px; background: #e53935; color: #fff; font-size: .7rem; padding: 0 8px; border-radius: 10px; }
  #countRow { display: flex; gap: 8px; }
  .ccard { flex: 1; font: inherit; font-size: 1.25rem; color: var(--ink); background: #fff; border: 4px solid var(--soft); border-radius: 16px; padding: 10px 2px; cursor: pointer; text-align: center; }
  .ccard small { display: block; font-size: .7rem; color: #8d6e63; }
  .ccard.on { border-color: var(--main); background: #fff3c4; }
  .shead { display: flex; align-items: center; gap: 10px; }
  .qbtn { font: inherit; font-size: .9rem; border: 0; background: #efe6d8; color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .sinfo { flex: 1; min-width: 0; font-size: .95rem; }
  .sbar { height: 10px; background: #eee; border-radius: 8px; overflow: hidden; margin-top: 4px; }
  .sbar i { display: block; height: 100%; width: 0; background: var(--main); transition: width .3s; }
  .result { text-align: center; }
  .result .rbig { font-size: 3rem; letter-spacing: 6px; }
  .result h2 { margin: 4px 0 10px; }
  .rstat { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px dashed var(--soft); font-size: 1.05rem; text-align: left; }
  .rstat b { color: #c66900; }
  #nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fffdf4; border-top: 2px solid var(--soft); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  #nav button { flex: 1; font: inherit; font-size: .78rem; color: var(--ink); border: 0; background: none; padding: 8px 2px 8px; cursor: pointer; position: relative; }
  #nav button .ne { display: block; font-size: 1.6rem; line-height: 1.1; }
  #nav button.on { color: #c66900; font-weight: bold; background: #fff3c4; }
  .ndot { position: absolute; top: 6px; left: 55%; width: 10px; height: 10px; border-radius: 50%; background: #e53935; }
  #nav.hidden { display: none; }
  .fieldwrap { position: relative; margin-left: auto; margin-right: auto; user-select: none; -webkit-user-select: none; }
  .fieldwrap canvas { position: absolute; left: 0; top: 0; }
  .fobjs, .fsvg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .fobjs { overflow: visible; }
  .spr { position: absolute; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .spr.selected { filter: drop-shadow(0 0 3px #ff8f00) drop-shadow(0 0 6px #ffb300); }
  .spr.ghost { opacity: .72; }
  .spr.crew { transition: left 1.3s linear, bottom 1.3s linear; }
  .spr.hop { animation: hop2 .5s ease-out; }
  @keyframes hop2 { 40% { transform: translateY(-14px); } }
  .fhit { position: absolute; inset: 0; cursor: pointer; z-index: 99999; }
  .arow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .tbtn.sub2 { background: #8d6e63; }
  .pathprev { width: 38%; max-width: 110px; aspect-ratio: 2/1; background: #ead9a8; border: 2px solid #c9b37c; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .pathprev.small { width: 56px; height: 28px; margin: 14px auto; }
  .ptabs { margin-top: 12px; }
  .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pcard { font: inherit; color: var(--ink); background: #fff; border: 3px solid var(--soft); border-radius: 12px; padding: 4px 2px; text-align: center; cursor: pointer; min-width: 0; font-size: .72rem; line-height: 1.25; }
  .pcard img { display: block; margin: 0 auto 2px; object-fit: contain; }
  .pcard small { display: block; color: #8d6e63; }
  .pcard.placed { background: #f1f8e9; border-color: #c5e1a5; }
  .pcard.lock { background: #eee; } .pcard.lock img { filter: grayscale(1); opacity: .4; }
  .credit { text-align: center; font-size: .7rem; color: #a1887f; margin: 4px 0 12px; }
  .row { display: flex; gap: 10px; margin-top: 10px; }

  /* zukan */
  #zukan { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .z { text-align: center; border-radius: 12px; padding: 4px 0; background: #eee; color: #bbb; }
  .z .k { font-size: 1.35rem; line-height: 1.1; display: block; }
  .z .r { font-size: .5rem; white-space: nowrap; overflow: hidden; }
  .z.got { background: #fff3c4; color: var(--ink); }
  .z .c { font-size: .5rem; }

  #cheer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 4rem; pointer-events: none; opacity: 0; }
  #cheer.show { animation: pop 1s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.2); }
    80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <b class="ttl">かんじ けいさん</b>
    <span class="coins"><img src="img/i_coin.webp" alt="⭐" width="22" height="22"> <b id="stars">0</b></span>
    <button id="sndBtn" class="ibtn" aria-label="おと">🔊</button>
    <button id="gear" class="ibtn" aria-label="せってい">⚙️</button>
  </header>
  <div id="storageWarn" class="hidden" style="background:#ffebee;color:#c62828;border-radius:12px;padding:8px 12px;font-size:.9rem">⚠️ この がめんでは あそんだ きろくが のこりません。ふつうの ブラウザで ひらいてね(おうちのひとへ: ⚙️ の コードで きろくを とっておけます)</div>

  <!-- ホーム -->
  <section id="s-home" class="screen on">
    <div class="hero card">
      <div class="pet"><span class="e" id="petE"></span><span id="petT"></span></div>
      <div id="gameStrip" class="strip"></div>
    </div>
    <button class="big-btn cta" id="goStudy">▶ べんきょう する</button>
    <button class="big-btn sub quick" id="quickGo"></button>
    <div id="rvLine" class="hidden"></div>
    <section id="daily" class="card"></section>
    <button class="card homeTown" id="homeTown"></button>
  </section>

  <!-- べんきょうの えらびかた -->
  <section id="s-study" class="screen">
    <h2 class="sh">① なにを べんきょう する?</h2>
    <div id="modeGrid"></div>
    <h2 class="sh">② なんもん やる?</h2>
    <div id="countRow"></div>
    <button class="big-btn cta" id="startBtn"></button>
  </section>

  <!-- べんきょう ちゅう -->
  <section id="s-session" class="screen">
    <div class="shead">
      <button id="quitBtn" class="qbtn">✕ やめる</button>
      <div class="sinfo"><span id="sessInfo"></span><div class="sbar"><i id="sessBar"></i></div></div>
    </div>
    <!-- もんだい -->
  <section id="quiz" class="card">
    <div id="formula"></div>
    <p id="hint"></p>
    <div id="choices"></div>
  </section>
    <!-- なぞりがき -->
  <section id="trace" class="card hidden">
    <div id="learn" class="hidden"></div>
    <p id="traceMsg"></p>
    <div id="pad"><svg id="sv" viewBox="0 0 109 109"></svg></div>
    <div id="dbg" class="hidden"></div>
    <div class="row">

    const fails = ((state.review[n] && state.review[n].fails) || 0) + 1;
    state.review[n] = { at: state.qn + Math.min(3 + 2 * (fails - 1), 9), fails };
    save(); renderZukan();

  }
  const before = stageIdx(Object.keys(state.got).length);

  const evolved = stageIdx(Object.keys(state.got).length) > before;
  addStars(1);

  if (state.miss[n]) state.miss[n] = Math.max(0, state.miss[n] - 1);

}

function makeCode() {
  const o = { v: 1, stars: state.stars, got: state.got, miss: state.miss, review: state.review, qn: state.qn,
    owned: state.owned, equip: state.equip, badges: state.badges, town: (townInit(), { b: state.town.b, order: state.town.order, placed: state.town.placed, decor: state.town.decor, dinv: state.town.dinv, path: state.town.path }), stat: { earned: state.stat.earned, bestCombo: state.stat.bestCombo, writes: state.stat.writes, revenge: state.stat.revenge, missions: state.stat.missions } };
  return "KJ1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function mergeCode(code) {          // いまの きろくに あわせる(あたらしいほうを のこす)。できなければ false
  const m = String(code).match(/KJ1:([A-Za-z0-9+/=]+)/);
  if (!m) return false;
  let o; try { o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { return false; }
  if (!o || typeof o !== "object" || typeof o.got !== "object") return false;
  const num = (x, hi) => (Number.isFinite(+x) ? Math.max(0, Math.min(hi, Math.floor(+x))) : 0);
  for (const k in o.got) { const n = +k, v = num(o.got[k], 9999); if (n >= 1 && n <= TOTAL && v > 0) state.got[n] = Math.max(state.got[n] || 0, v); }
  for (const k in (o.miss || {})) { const n = +k; if (n >= 1 && n <= TOTAL) state.miss[n] = Math.max(state.miss[n] || 0, num(o.miss[k], 99)); }
  for (const k in (o.review || {})) {
    const n = +k, v = o.review[k];
    if (n >= 1 && n <= TOTAL && v && !state.review[n]) state.review[n] = { at: num(v.at, 1e9), fails: num(v.fails, 99) || 1 };
  }
  for (const it of SHOP) {
    if (o.owned && o.owned[it.id]) state.owned[it.id] = 1;
    if (o.equip && o.equip[it.slot] === it.id && !state.equip[it.slot]) state.equip[it.slot] = it.id;
  }
  for (const b of BADGES) if (o.badges && o.badges[b.id] && !state.badges[b.id]) state.badges[b.id] = String(o.badges[b.id]).slice(0, 10);
  for (const k of ["earned", "bestCombo", "writes", "revenge", "missions"]) state.stat[k] = Math.max(state.stat[k] || 0, num(o.stat && o.stat[k], 1e6));
  if (o.town && o.town.b && typeof o.town.b === "object") {
    for (const b of TOWN) {
      const v = Math.min(num(o.town.b[b.id], b.lv), b.lv);
      if (v > 0) { state.town.b[b.id] = Math.max(state.town.b[b.id] || 0, v); if (!state.town.order.includes(b.id)) state.town.order.push(b.id); }
    }
    const T = state.town, tt = o.town;
    if (tt.placed && typeof tt.placed === "object") T.layoutV = 2;      // 置いた ばしょも うけつぐ
    townInit();
    if (!Object.keys(T.placed).length && tt.placed && typeof tt.placed === "object")
      for (const id in tt.placed) { const q = tt.placed[id]; if (T.b[id] && FP[id] && q && Number.isInteger(q.x) && Number.isInteger(q.y)) T.placed[id] = { x: q.x, y: q.y, flip: q.flip ? 1 : 0 }; }
    if (!T.decor.length && Array.isArray(tt.decor))
      for (const od of tt.decor.slice(0, 200)) { const d = od && dDef(od.d); if (d && !d.flat && Number.isInteger(od.x) && Number.isInteger(od.y)) T.decor.push({ d: od.d, x: od.x, y: od.y, flip: od.flip ? 1 : 0 }); }
    if (!T.path.length && Array.isArray(tt.path)) T.path = tt.path.filter(k => /^\d{1,2},\d{1,2}$/.test(k)).slice(0, 200);
    for (const k in (tt.dinv || {})) { const d = dDef(k); if (d && !d.flat) T.dinv[k] = Math.max(T.dinv[k] || 0, Math.min(99, Math.max(0, Math.floor(+tt.dinv[k]) || 0))); }
    townInit();
    if (!(tt.placed && typeof tt.placed === "object")) {                 // 置き場所の ない 古い コード: じどうで ならべる
      const occ = new Set(occMap().keys());
      for (const id of Object.keys(T.b).filter(i => FP[i] && !T.placed[i]).sort((x, y) => FP[y] - FP[x])) {
        const pos = findSpot(FP[id], tN(), occ);
        if (pos) { T.placed[id] = { x: pos.x, y: pos.y, flip: 0 }; addCells(occ, pos.x, pos.y, FP[id]); }
      }

  state.qn = Math.max(state.qn, num(o.qn, 1e9));

  return true;
}

$("quitBtn").addEventListener("click", () => {
  if (!quitArmed) {
    quitArmed = true; $("quitBtn").textContent = "ほんとうに やめる?";
    quitTimer = setTimeout(() => { quitArmed = false; $("quitBtn").textContent = "✕ やめる"; }, 3000);
    return;
  }
  clearTimeout(quitTimer); quitArmed = false; sessSeq++;
  const s = sess; sess = null; tr = null; locked = true;
  if (s && s.done > 0 && s.count) { sess = s; showResult(true); return; }   // 1もんでも おわっていれば けっかを みせる
  show("home");
});
function showResult(quit) {
  const sv0 = sess; sess = null; tr = null;
  const done = Math.max(sv0.done, 1), total = quit ? done : (sv0.count || done);
  const acc = sv0.ok1 / done, rating = acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1;
  const earned = state.stat.earned - sv0.earned0, rc = Object.keys(state.review).length;
  const can = tBuilt().some(id => { const c = tNextCost(id); return c !== null && state.stars >= c; }) || TOWN.some(b => !state.town.b[b.id] && tUnlocked(b) && state.stars >= b.cost[0]);
  $("s-result").innerHTML = `<section class="card result">
      <div class="rbig">${"⭐".repeat(rating)}${"☆".repeat(3 - rating)}</div>
      <h2>${quit ? "ここまで おつかれさま!" : rating === 3 ? "すごい! かんぺき!" : rating === 2 ? "よく がんばったね!" : "つぎは もっと できるよ!"}</h2>
      <div class="rstat"><span>1かいで せいかい</span><b>${sv0.ok1} / ${total}</b></div>
      <div class="rstat"><span>あたらしい かんじ</span><b>${sv0.newN} こ</b></div>
      <div class="rstat"><span>ベスト コンボ</span><b>🔥 ${sv0.comboBest}</b></div>
      <div class="rstat"><span>ゲットした ⭐</span><b>+${earned}</b></div>
      <div class="rstat"><span>おぼえなおし のこり</span><b>🔁 ${rc} こ</b></div>
    </section>
    <button class="big-btn cta" id="rAgain">もういちど</button>
    ${can ? '<button class="big-btn sub" id="rTown">🏘️ ⭐で まちを そだてる</button>' : ""}
    <button class="big-btn sub" id="rOther">ほかの べんきょう</button>
    <button class="big-btn sub" id="rHome">🏠 ホームへ</button>`;
  show("result"); sfx.done(); if (rating === 3) setTimeout(sfx.sparkle, 350);
  $("rAgain").onclick = () => { sfx.tap(); startSession(); };
  if ($("rTown")) $("rTown").onclick = () => { sfx.tap(); show("town"); };
  $("rOther").onclick = () => { sfx.tap(); show("study"); };
  $("rHome").onclick = () => { sfx.tap(); show("home"); };
}

renderZukan();
renderGame();
show("home");
</script>
</body>
