<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<!--pwa--><link rel="manifest" href="manifest.webmanifest">
<!--pwa--><link rel="apple-touch-icon" href="icon-180.png">
<!--pwa--><meta name="apple-mobile-web-app-capable" content="yes">
<!--pwa--><meta name="mobile-web-app-capable" content="yes">
<!--pwa--><meta name="apple-mobile-web-app-title" content="かんじ">
<!--pwa--><meta name="apple-mobile-web-app-status-bar-style" content="default">
<!--pwa--><meta name="theme-color" content="#fff8e1">
<title>かんじ けいさん</title>
<style>
  :root {
    --bg: #fff8e1; --ink: #3e2723; --card: #ffffff; --main: #ff8f00;
    --ok: #43a047; --ng: #e53935; --soft: #ffe0b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  @media (display-mode: standalone) {      /* ホーム画面から ひらいた とき(ノッチを さける) */
    #app { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  }
  h1 { margin: 4px 0; font-size: 1.6rem; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 var(--soft); }
  .big-btn { font: inherit; font-size: 1.6rem; border: 0; border-radius: 18px; padding: 16px 20px;
    background: var(--main); color: #fff; box-shadow: 0 5px 0 #c66900; cursor: pointer; width: 100%; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c66900; }
  .big-btn.sub { background: #8d6e63; box-shadow: 0 5px 0 #5d4037; font-size: 1.2rem; }
  .tabs { display: flex; gap: 8px; }
  .tab { font: inherit; font-size: 1.1rem; padding: 10px 4px; border: 3px solid var(--soft);
    border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .tab.on { background: var(--main); border-color: var(--main); color: #fff; }
  .pet { text-align: center; font-size: 1rem; }
  .pet .e { font-size: 2.6rem; display: block; line-height: 1.1; }
  .pic { font-size: 4.2rem; line-height: 1; }
  .morph { animation: morph 1s ease-in-out; }
  @keyframes morph { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(.2) rotate(180deg); opacity: 0; }
    55% { transform: scale(.2) rotate(180deg); opacity: 0; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
  .choice.txt .k { font-size: 2rem; padding: 10px 0; }
  .tabs { flex-wrap: wrap; }
  .tab { flex: 1 1 45%; }
  .hidden { display: none !important; }

  /* mondai */
  #formula { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  .num { text-align: center; }
  .num .k { font-size: 4.2rem; line-height: 1; }
  .num .r { font-size: .95rem; color: #8d6e63; }
  .op { font-size: 3rem; }
  .q { font-size: 4.2rem; color: var(--main); }
  #hint { text-align: center; font-size: 1.1rem; min-height: 1.6em; }
  #choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choice { font: inherit; background: #fff; border: 4px solid var(--soft); border-radius: 18px;
    padding: 6px 0; cursor: pointer; text-align: center; }
  .choice .k { font-size: 3rem; display: block; line-height: 1.1; }
  .choice .r { font-size: .85rem; color: #8d6e63; }
  .choice.ok { border-color: var(--ok); background: #e8f5e9; }
  .choice.ng { border-color: var(--ng); background: #ffebee; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* nazori */
  #traceMsg { text-align: center; font-size: 1.2rem; margin: 0 0 8px; }
  #pad { position: relative; width: 100%; aspect-ratio: 1; border: 4px dashed var(--soft); border-radius: 16px; background: #fffdf7; }
  #sv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #sv path, #sv polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ghost { stroke: #e6dcd5; stroke-width: 6; }
  .done { stroke: #ff8f00; stroke-width: 6; }
  .demo { stroke: #1e88e5; stroke-width: 6; }
  .user { stroke: #1e88e5; stroke-width: 5; opacity: .85; }
  .user.bad { stroke: #e53935; transition: opacity .6s; opacity: 0; }
  .startdot { fill: #1e88e5; animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .startnum { fill: #fff; font-size: 7px; font-weight: bold; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  @keyframes pulse { 50% { transform: scale(1.35); } }
  .opt { display: block; margin: 8px 0; font-size: 1rem; }
  .opt label { margin-right: 8px; }
  .endtag { font-size: 5px; font-weight: bold; fill: #1e88e5; paint-order: stroke; stroke: #fffdf7; stroke-width: 1.2px; }
  #dbg { font: 11px/1.4 monospace; color: #6d4c41; white-space: pre-wrap; margin-top: 8px; }
  #learn { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    background: #fff3e0; border: 3px dashed var(--main); border-radius: 16px; padding: 8px 12px; margin-bottom: 8px; }
  #learn .lk { font-size: 3rem; line-height: 1; }
  #learn .lr { font-size: 1.3rem; font-weight: bold; }
  #learn .lx { font-size: 1rem; color: #8d6e63; width: 100%; text-align: center; }
  .z.rv { background: #fff0e0; color: #c98a45; outline: 2px dashed var(--main); outline-offset: -2px; }
  .z.rv .k { opacity: .75; }
  #rvLine { text-align: center; font-size: .95rem; color: #c66900; }
  .sent { font-size: 1.7rem; line-height: 1.6; text-align: center; padding: 8px 0; }
  .blank { display: inline-block; min-width: 1.6em; color: var(--main); border-bottom: 4px solid var(--main); }
  .strip { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 1.05rem; min-height: 1.4em; }
  .strip b { color: #c66900; }
  #daily { padding: 10px 14px; }
  #daily h3, #rewards h3 { margin: 0 0 6px; font-size: 1rem; }
  .ms { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: .95rem; }
  .ms .bar2 { flex: 1; height: 8px; background: #eee; border-radius: 6px; overflow: hidden; min-width: 40px; }
  .ms .bar2 i { display: block; height: 100%; background: var(--main); }
  .ms.done { color: #43a047; } .ms.done .bar2 i { background: #43a047; }
  .rtabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .rtabs .tab { flex: 1; font-size: 1rem; padding: 8px; }
  #bgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bd { text-align: center; background: #fff3c4; border-radius: 12px; padding: 6px 2px; font-size: .7rem; line-height: 1.25; }
  .bd .be { font-size: 1.7rem; display: block; }
  .bd.lock { background: #eee; color: #aaa; } .bd.lock .be { filter: grayscale(1); opacity: .35; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--soft); }
  .item .ie { font-size: 1.8rem; width: 2.2rem; text-align: center; }
  .item .in { flex: 1; font-size: .95rem; }
  .item button { font: inherit; font-size: .95rem; padding: 6px 12px; border: 0; border-radius: 12px; background: var(--main); color: #fff; cursor: pointer; }
  .item button.off { background: #bdbdbd; } .item button.on { background: #43a047; }
  .petwrap { position: relative; display: inline-block; }
  .acc { position: absolute; font-size: 1.15rem; line-height: 1; pointer-events: none; }
  .acc.head { top: -.45rem; left: 50%; transform: translateX(-50%); }
  .acc.face { top: 1.15rem; left: 50%; transform: translateX(-50%); }
  .acc.neck { bottom: -.15rem; left: 50%; transform: translateX(-50%); }
  .acc.side { right: -1.1rem; bottom: .1rem; }
  #toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 20;
    background: #3e2723; color: #fff8e1; padding: 10px 16px; border-radius: 14px; font-size: 1rem; max-width: 92vw; text-align: center; box-shadow: 0 4px 12px #0004; }
  #town h3 { margin: 0; font-size: 1.05rem; }
  .thead > div:first-child { min-width: 0; }
  .thead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .tsub { font-size: .85rem; color: #8d6e63; }
  .tchest { flex: none; white-space: nowrap; border: 0; background: #fff3c4; border-radius: 14px; padding: 4px 10px; font: inherit; font-size: .9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .tchest img { width: 34px; height: 34px; object-fit: contain; }
  .tchest.ready { animation: pulse2 1.2s ease-in-out infinite; background: #ffe082; }
  .tchest.done { opacity: .55; }
  @keyframes pulse2 { 50% { transform: scale(1.07); } }
  .crew { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .crew button { border: 0; background: #f1f8e9; border-radius: 12px; padding: 2px; width: 44px; height: 44px; cursor: pointer; }
  .crew button img { width: 100%; height: 100%; object-fit: contain; }
  .crew button.lock { background: #eee; font-size: 1rem; color: #aaa; }
  .crew button.hop img { animation: hop .5s ease-out; }
  @keyframes hop { 40% { transform: translateY(-10px) rotate(-6deg); } 70% { transform: translateY(0) rotate(4deg); } }
  .tgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tcell { background: linear-gradient(#eaf6dc, #d3eab8); border: 3px solid transparent; border-radius: 14px; padding: 4px 2px 4px; text-align: center; cursor: pointer;
    font: inherit; font-size: .78rem; color: var(--ink); min-width: 0; }
  .tcell img { display: block; width: 100%; height: 86px; object-fit: contain; margin: 0 auto 2px; pointer-events: none; }
  .tcell { position: relative; }
  .tcell.sel { border-color: var(--main); }
  .tcell.pop img { animation: pop2 .7s ease-out; }
  @keyframes pop2 { 0% { transform: scale(.3); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .tcell.add { background: #fff8e1; border: 3px dashed var(--main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 118px; color: #c66900; font-size: .95rem; }
  .tcell.add .plus { font-size: 2rem; line-height: 1; }
  .tlv { color: #c66900; font-weight: bold; }
  .tpanel { margin-top: 10px; background: #fffdf4; border: 2px solid var(--soft); border-radius: 14px; padding: 10px; }
  .tpanel .big { display: flex; gap: 12px; align-items: center; }
  .tpanel .big > img { width: 38%; max-width: 150px; height: auto; object-fit: contain; }
  .tpanel .info { flex: 1; min-width: 0; }
  .tpanel .nm { font-size: 1.15rem; font-weight: bold; }
  .tbtn { white-space: nowrap; font: inherit; font-size: .92rem; border: 0; border-radius: 12px; padding: 8px 14px; background: var(--main); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; }
  .tbtn.off { background: #bdbdbd; }
  .tbtn img { width: 20px; height: 20px; }
  .tchip { display: inline-block; background: #fff3c4; border-radius: 10px; padding: 0 8px; margin-right: 4px; font-size: .95rem; }
  .blist .bi { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--soft); }
  .blist .bi img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .blist .bi.lock img { filter: grayscale(1) brightness(.9); opacity: .45; }
  .blist .bi .tx { flex: 1; min-width: 0; font-size: .92rem; }
  .blist .bi.lock .tx { color: #9e9e9e; }
  .newdot { display: inline-block; background: #e53935; color: #fff; border-radius: 10px; font-size: .7rem; padding: 0 6px; margin-left: 4px; vertical-align: middle; }
  body { padding-bottom: 0; }
  #app { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  .screen { display: none; flex-direction: column; gap: 12px; }
  .screen.on { display: flex; }
  #top { display: flex; align-items: center; gap: 8px; }
  #top .ttl { flex: 1; font-size: 1.15rem; }
  #top .coins { display: flex; align-items: center; gap: 4px; background: #fff3c4; border-radius: 14px; padding: 2px 10px; font-size: 1.05rem; }
  #top .coins img { width: 22px; height: 22px; }
  .ibtn { font-size: 1.3rem; border: 0; background: none; cursor: pointer; padding: 4px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 1.05rem; }
  .hero { text-align: center; padding: 12px; }
  .hero .pet .e { font-size: 3.2rem; }
  .cta { font-size: 1.5rem; padding: 18px 20px; }
  .quick { font-size: 1.05rem; padding: 12px 16px; }
  .homeTown { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer; padding: 10px 14px; }
  .homeTown img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .homeTown .tx { flex: 1; min-width: 0; }
  .homeTown .tx small { color: #8d6e63; display: block; }
  .sh { margin: 4px 0 0; font-size: 1.1rem; }
  #modeGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mcard { font: inherit; color: var(--ink); background: #fff; border: 4px solid var(--soft); border-radius: 18px; padding: 10px 8px; text-align: center; cursor: pointer; min-width: 0; position: relative; }
  .mcard .me { font-size: 2.2rem; display: block; line-height: 1.2; }
  .mcard .mn { font-weight: bold; font-size: 1rem; display: block; }
  .mcard .md { font-size: .78rem; color: #8d6e63; display: block; margin-top: 2px; }
  .mcard.on { border-color: var(--main); background: #fff3c4; }
  .mcard .rec { position: absolute; top: -9px; right: 8px; background: #e53935; color: #fff; font-size: .7rem; padding: 0 8px; border-radius: 10px; }
  #countRow { display: flex; gap: 8px; }
  .ccard { flex: 1; font: inherit; font-size: 1.25rem; color: var(--ink); background: #fff; border: 4px solid var(--soft); border-radius: 16px; padding: 10px 2px; cursor: pointer; text-align: center; }
  .ccard small { display: block; font-size: .7rem; color: #8d6e63; }
  .ccard.on { border-color: var(--main); background: #fff3c4; }
  .shead { display: flex; align-items: center; gap: 10px; }
  .qbtn { font: inherit; font-size: .9rem; border: 0; background: #efe6d8; color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .sinfo { flex: 1; min-width: 0; font-size: .95rem; }
  .sbar { height: 10px; background: #eee; border-radius: 8px; overflow: hidden; margin-top: 4px; }
  .sbar i { display: block; height: 100%; width: 0; background: var(--main); transition: width .3s; }
  .result { text-align: center; }
  .result .rbig { font-size: 3rem; letter-spacing: 6px; }
  .result h2 { margin: 4px 0 10px; }
  .rstat { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px dashed var(--soft); font-size: 1.05rem; text-align: left; }
  .rstat b { color: #c66900; }
  #nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fffdf4; border-top: 2px solid var(--soft); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  #nav button { flex: 1; font: inherit; font-size: .78rem; color: var(--ink); border: 0; background: none; padding: 8px 2px 8px; cursor: pointer; position: relative; }
  #nav button .ne { display: block; font-size: 1.6rem; line-height: 1.1; }
  #nav button.on { color: #c66900; font-weight: bold; background: #fff3c4; }
  .ndot { position: absolute; top: 6px; left: 55%; width: 10px; height: 10px; border-radius: 50%; background: #e53935; }
  #nav.hidden { display: none; }
  .credit { text-align: center; font-size: .7rem; color: #a1887f; margin: 4px 0 12px; }
  .row { display: flex; gap: 10px; margin-top: 10px; }

  /* zukan */
  #zukan { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .z { text-align: center; border-radius: 12px; padding: 4px 0; background: #eee; color: #bbb; }
  .z .k { font-size: 1.35rem; line-height: 1.1; display: block; }
  .z .r { font-size: .5rem; white-space: nowrap; overflow: hidden; }
  .z.got { background: #fff3c4; color: var(--ink); }
  .z .c { font-size: .5rem; }

  #cheer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 4rem; pointer-events: none; opacity: 0; }
  #cheer.show { animation: pop 1s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.2); }
    80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <b class="ttl">かんじ けいさん</b>
    <span class="coins"><img src="img/i_coin.webp" alt="⭐" width="22" height="22"> <b id="stars">0</b></span>
    <button id="sndBtn" class="ibtn" aria-label="おと">🔊</button>
    <button id="gear" class="ibtn" aria-label="せってい">⚙️</button>
  </header>
  <div id="storageWarn" class="hidden" style="background:#ffebee;color:#c62828;border-radius:12px;padding:8px 12px;font-size:.9rem">⚠️ この がめんでは あそんだ きろくが のこりません。ふつうの ブラウザで ひらいてね(おうちのひとへ: ⚙️ の コードで きろくを とっておけます)</div>

  <!-- ホーム -->
  <section id="s-home" class="screen on">
    <div class="hero card">
      <div class="pet"><span class="e" id="petE"></span><span id="petT"></span></div>
      <div id="gameStrip" class="strip"></div>
    </div>
    <button class="big-btn cta" id="goStudy">▶ べんきょう する</button>
    <button class="big-btn sub quick" id="quickGo"></button>
    <div id="rvLine" class="hidden"></div>
    <section id="daily" class="card"></section>
    <button class="card homeTown" id="homeTown"></button>
  </section>

  <!-- べんきょうの えらびかた -->
  <section id="s-study" class="screen">
    <h2 class="sh">① なにを べんきょう する?</h2>
    <div id="modeGrid"></div>
    <h2 class="sh">② なんもん やる?</h2>
    <div id="countRow"></div>
    <button class="big-btn cta" id="startBtn"></button>
  </section>

  <!-- べんきょう ちゅう -->
  <section id="s-session" class="screen">
    <div class="shead">
      <button id="quitBtn" class="qbtn">✕ やめる</button>
      <div class="sinfo"><span id="sessInfo"></span><div class="sbar"><i id="sessBar"></i></div></div>
    </div>
    <!-- もんだい -->
  <section id="quiz" class="card">
    <div id="formula"></div>
    <p id="hint"></p>
    <div id="choices"></div>
  </section>
    <!-- なぞりがき -->
  <section id="trace" class="card hidden">
    <div id="learn" class="hidden"></div>
    <p id="traceMsg"></p>
    <div id="pad"><svg id="sv" viewBox="0 0 109 109"></svg></div>
    <div id="dbg" class="hidden"></div>
    <div class="row">
      <button class="big-btn sub" id="hintBtn">👀 おてほん</button>
      <button class="big-btn sub" id="clearBtn">🔄 やりなおし</button>
    </div>
  </section>
  </section>

  <!-- けっか -->
  <section id="s-result" class="screen"></section>

  <!-- まち -->
  <section id="s-town" class="screen">
    <section id="town" class="card"></section>
  </section>

  <!-- ずかん -->
  <section id="s-zukan" class="screen">
    <section class="card">
      <div class="bar"><span>かんじずかん</span><span><b id="gotCount">0</b> / <span id="totalCount">80</span></span></div>
      <div id="zukan"></div>
    </section>
    <section id="rewards" class="card">
    <div class="rtabs"><button id="rtBadge" class="tab on">🏅 バッジ</button><button id="rtShop" class="tab">🛍️ おみせ</button></div>
    <div id="rBody"></div>
  </section>
    <p class="credit">かきじゅんデータ: KanjiVG (CC BY-SA 3.0) <a href="https://kanjivg.tagaini.net">kanjivg.tagaini.net</a></p>
  </section>

  <!-- せってい -->
  <section id="s-settings" class="screen">
    <button id="backBtn" class="big-btn sub" style="font-size:1rem;padding:10px">← もどる</button>
    <section id="panel" class="card">
    <b>おうちのひとへ(せってい)</b>
    <div class="opt">かきとりの むずかしさ:
      <label><input type="radio" name="lv" value="0"> やさしい</label>
      <label><input type="radio" name="lv" value="1"> ふつう</label>
      <label><input type="radio" name="lv" value="2"> きびしい</label></div>

}
function calcPool() {
  const pool = [];
  for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++) {
    const ans = a + b;
    pool.push({ a, b, ans, op: "+", mode: "calc", w: 1 + (state.miss[ans] || 0) * 2 });
  }
  for (let a = 2; a <= 10; a++) for (let b = 1; b < a; b++) {
    const ans = a - b;
    pool.push({ a, b, ans, op: "-", mode: "calc", w: 1 + (state.miss[ans] || 0) * 2 });

}

  if (state.mode === "mix") {       // 80字ぜんぶから。まだ のっていない字と にがてな字を おおめに
    const q = weighted(ALL.map(d => ({ n: d.n, w: 1 + (state.miss[d.n] || 0) * 2 + (state.got[d.n] ? 0 : 2) })));
    const ms = modesFor(q.n);
    return buildQ(ms[Math.floor(Math.random() * ms.length)], q.n);
  }
  if (state.mode === "nat" || state.mode === "read" || state.mode === "sent") {
    const src = state.mode === "nat" ? PIC : ALL;
    return weighted(src.map(d => ({ a: d.n, ans: d.n, mode: state.mode, w: 1 + (state.miss[d.n] || 0) * 2 })));
  }
  if (state.mode === "opp") {
    const pool = OPP.map(d => ({ a: d.n, ans: partner(d.n), mode: "opp", w: 1 + (state.miss[partner(d.n)] || 0) * 2 }));
    let x = Math.random() * pool.reduce((t, q) => t + q.w, 0);
    for (const q of pool) { x -= q.w; if (x <= 0) return q; }
    return pool[0];
  }
  return weighted(calcPool());
}

function newQuestion() {
  locked = false;
  cur = pickQuestion();
  cur.missed = false;                // この もんだいで 1かいでも まちがえたか
  state.qn++; save();
  const opp = cur.mode === "opp", nat = cur.mode === "nat", rd = cur.mode === "read";
  const sn = cur.mode === "sent";
  const pool = (opp ? OPP : nat ? PIC : (rd || sn) ? ALL : KANJI).map(d => d.n);
  if (sn) {
    const txt = SENT[byN(cur.a).k].split("|")[0];
    $("formula").innerHTML = `<div class="sent" id="sent">${txt.replace("＿", '<span class="blank" id="blank">＿</span>')}</div>`;
    $("hint").textContent = "＿に はいる かんじは どれかな?";
  } else if (nat) {

    $("formula").innerHTML = `<div class="num"><div class="k" style="font-size:5rem">${byN(cur.a).k}</div></div>`;
    $("hint").textContent = "なんて よむのかな?";
  } else if (opp) {

    $("hint").textContent = "はんたいの かんじは どれかな?";
  } else {
    $("formula").innerHTML = numHtml(cur.a) + `<span class="op">${cur.op === "+" ? "+" : "−"}</span>` + numHtml(cur.b) + `<span class="op">=</span><span class="q">?</span>`;
    $("hint").textContent = "こたえの かんじは どれかな?";
  }
  // 選択肢: 正解 + ダミー2つ
  const set = new Set([cur.ans]);
  while (set.size < 3) {
    const n = pool[Math.floor(Math.random() * pool.length)];
    if (rd && byN(n).r === byN(cur.ans).r) continue; // おなじ よみは まぜない
    set.add(n);
  }
  const arr = [...set].sort(() => Math.random() - 0.5);
  $("choices").innerHTML = arr.map(n => {
    const d = byN(n);
    if (rd) return `<button class="choice txt" data-n="${n}"><span class="k">${d.r}</span></button>`;
    if (nat || sn) return `<button class="choice" data-n="${n}"><span class="k">${d.k}</span></button>`;
    return `<button class="choice" data-n="${n}"><span class="k">${d.k}</span><span class="r">${d.r}</span></button>`;
  }).join("");
  if (cur.retry) $("hint").textContent = "🔁 リベンジ! " + $("hint").textContent;
  $("quiz").classList.remove("hidden");
  $("trace").classList.add("hidden");
  speak(sn ? SENT[byN(cur.a).k].split("|")[0].replace("＿", "なに") : rd ? `${byN(cur.a).k} は なんと よむ?` : nat ? "この え は どの かんじ?" : opp ? `${byN(cur.a).r} の はんたいは?` : `${byN(cur.a).r} ${cur.op === "+" ? "たす" : "ひく"} ${byN(cur.b).r} は?`);
}

// ---- なぞりがき(かきじゅん ガイド) ----
const NS = "http://www.w3.org/2000/svg", sv = $("sv");
const N = 16;                      // 比べるときの点の数
let tr = null;                     // 練習中の状態

function el(name, attrs, cls) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (cls) e.setAttribute("class", cls);
  return e;
}
function resample(pts, n) {        // 長さで等間隔に取り直す
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const total = L[L.length - 1], out = [];
  for (let i = 0, j = 1; i < n; i++) {
    const t = total * i / (n - 1);
    while (j < pts.length - 1 && L[j] < t) j++;
    const span = L[j] - L[j - 1] || 1, f = Math.min(1, Math.max(0, (t - L[j - 1]) / span));
    out.push({ x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * f, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * f });
  }
  return { pts: out, len: total };
}
function meanDist(a, b) { let t = 0; for (let i = 0; i < a.length; i++) t += Math.hypot(a[i].x - b[i].x, a[i].y - b[i].y); return t / a.length; }
function refPoints(d) {
  const p = el("path", { d }), L = p.getTotalLength(), raw = [];
  for (let i = 0; i <= 40; i++) { const q = p.getPointAtLength(L * i / 40); raw.push({ x: q.x, y: q.y }); }
  return resample(raw, N);
}

const HOOK = "㇚㇁㇆㇖㇟㇈㇂㇃㇉", SWEEP = "㇒㇓㇏㇀", STOP = "㇐㇑㇕㇄";
function strokeKind(type) {         // はね / はらい / とめ / (みない)
  if (!type || type.includes("/")) return null;
  const c = type[0];
  return HOOK.includes(c) ? "hook" : SWEEP.includes(c) ? "sweep" : STOP.includes(c) ? "stop" : null;
}
const KIND_LABEL = { hook: "はね", sweep: "はらい", stop: "とめ" };
function arcAt(pts, f) {            // 長さの f(0〜1) の ところの 点
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const t = L[L.length - 1] * f;
  let j = 1; while (j < pts.length - 1 && L[j] < t) j++;
  const span = L[j] - L[j - 1] || 1, g = Math.min(1, Math.max(0, (t - L[j - 1]) / span));
  return { x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * g, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * g,
           t: (pts[j - 1].t ?? 0) + ((pts[j].t ?? 0) - (pts[j - 1].t ?? 0)) * g, total: L[L.length - 1] };
}
function hookTurn(pts) {            // さいごの むきが どれだけ まがったか(度)。+/- は まがる ほうこう
  const a = arcAt(pts, .45), b = arcAt(pts, .85), c = arcAt(pts, .93), e = pts[pts.length - 1];
  if (Math.hypot(e.x - c.x, e.y - c.y) < 1.5) return 0;
  let t = (Math.atan2(e.y - c.y, e.x - c.x) - Math.atan2(b.y - a.y, b.x - a.x)) * 180 / Math.PI;
  while (t > 180) t -= 360; while (t < -180) t += 360;
  return t;
}
function tailRatio(pts) {           // さいごの 25% の はやさ ÷ ぜんたいの はやさ(1より小さい=ゆっくり とまった)
  const s = pts[0], q = arcAt(pts, .75), e = pts[pts.length - 1];
  const dtAll = (e.t ?? 0) - (s.t ?? 0), dtTail = (e.t ?? 0) - q.t;
  if (!(dtAll > 30) || !(dtTail > 5)) return null;
  const tailLen = q.total * .25;
  return (tailLen / dtTail) / (q.total / dtAll);
}
function quality(userPts, meta) {   // { kind, ok:true/false/null, info }
  if (!meta.kind) return { kind: null };
  if (meta.kind === "hook") {
    const ut = hookTurn(userPts);
    return { kind: "hook", ok: Math.abs(ut) >= 35 && Math.sign(ut) === Math.sign(meta.turn), info: `hook ${Math.round(ut)}° (おてほん ${Math.round(meta.turn)}°)` };
  }
  const r = tailRatio(userPts);
  if (r === null) return { kind: meta.kind, ok: null, info: "speed n/a" };
  return { kind: meta.kind, ok: meta.kind === "sweep" ? r >= .6 : r <= .75, info: `tail速度比 ${r.toFixed(2)}` };
}

function startTrace() {
  if (curScreen !== "session") return;
  const d = byN(cur.ans);
  $("quiz").classList.add("hidden");
  $("trace").classList.remove("hidden");
  const ds = window.STROKES && STROKES[d.k];
  if (!ds) { finishTrace(); return; }      // データがない字は そのまま ずかんへ
  sv.innerHTML = "";
  const types = (window.STROKE_TYPES && STROKE_TYPES[d.k]) || [];
  const meta = ds.map((x, i) => {
    const kind = strokeKind(types[i]), path = el("path", { d: x }), L = path.getTotalLength(), raw = [];
    for (let j = 0; j <= 60; j++) { const q = path.getPointAtLength(L * j / 60); raw.push({ x: q.x, y: q.y }); }
    return { kind, turn: kind === "hook" ? hookTurn(raw) : 0, end: raw[60] };
  });
  const relearn = !!cur.missed;
  $("learn").classList.toggle("hidden", !relearn);
  if (relearn) {
    const ctx = cur.mode === "calc" ? `${byN(cur.a).k} ${cur.op === "+" ? "+" : "−"} ${byN(cur.b).k} = ${d.k}`
      : cur.mode === "opp" ? `${byN(cur.a).k} ↔ ${d.k}`
      : cur.mode === "sent" ? SENT[d.k].split("|")[0].replace("＿", d.k) : "";
    $("learn").innerHTML = `<span class="lk">${d.k}</span><span class="lr">「${d.r}」</span>${d.e ? `<span class="lk" style="font-size:2.2rem">${d.e}</span>` : ""}`
      + (ctx ? `<span class="lx">${ctx}</span>` : "") + `<span class="lx">よく みて、かきじゅんを おぼえよう</span>`;
    speak(d.r);
  }
  tr = { relearn, ds, refs: ds.map(refPoints), meta, idx: 0, misses: 0, busy: false, user: null, k: d.k, qOk: 0, qTotal: 0 };
  ds.forEach(x => sv.appendChild(el("path", { d: x }, "ghost")));
  showNext(state.set.autoDemo || relearn);
}
function say(t) { $("traceMsg").textContent = t; }
function clearMarks() { sv.querySelectorAll(".startdot,.startnum,.demo,.endtag").forEach(e => e.remove()); }
function showNext(withDemo) {
  clearMarks();
  const i = tr.idx, st = tr.refs[i].pts[0];
  sv.appendChild(el("circle", { cx: st.x, cy: st.y, r: 6 }, "startdot"));
  const t = el("text", { x: st.x, y: st.y }, "startnum"); t.textContent = i + 1; sv.appendChild(t);
  const m = tr.meta[i];
  if (state.set.quality && m.kind) {
    const tg = el("text", { x: Math.min(100, Math.max(4, m.end.x + 3)), y: Math.min(106, Math.max(6, m.end.y + 5)) }, "endtag");
    tg.textContent = KIND_LABEL[m.kind]; sv.appendChild(tg);
  }
  say(`「${tr.k}」 ${i + 1}かくめ(${tr.ds.length}かくの うち)  ●から ひとふで!`);
  if (withDemo) demo();
}
function demo() {                         // おてほん: 筆の動きをアニメーションで見せる
  sv.querySelectorAll(".demo").forEach(e => e.remove());
  const dp = el("path", { d: tr.ds[tr.idx], pathLength: 1 }, "demo");
  dp.style.strokeDasharray = 1; dp.style.strokeDashoffset = 1;

}
function acceptStroke(auto, userPts) {
  const i = tr.idx, dp = el("path", { d: tr.ds[i], pathLength: 1 }, "done");
  dp.style.strokeDasharray = 1; dp.style.strokeDashoffset = auto ? 1 : 0;   // 自動のときは なぞって見せる
  sv.appendChild(dp);
  if (auto) { dp.getBoundingClientRect(); dp.style.transition = "stroke-dashoffset .9s"; dp.style.strokeDashoffset = 0; }
  // はね・はらい・とめ (ほめるだけ。ダメだしで とめない)
  let qmsg = "", tip = "";
  if (!auto && state.set.quality && userPts) {
    const q = quality(userPts, tr.meta[i]);
    if (q.ok !== null && q.kind) {
      if (q.kind !== "stop") { tr.qTotal++; if (q.ok) tr.qOk++; }   // 「とめ」は ほめるだけ(点数に いれない)
      if (q.ok) qmsg = { hook: "✨ はねも ばっちり!", sweep: "✨ すーっと はらえたね!", stop: "✨ ぴたっと とまったね!" }[q.kind];
      else tip = { hook: "ここは さいごに ピッと はねると もっと いいよ", sweep: "ここは さいごまで すーっと はらうと もっと いいよ", stop: "" }[q.kind];
    }
    window.lastQ = q.info;
  }
  tr.idx++; tr.misses = 0;
  if (tr.idx >= tr.ds.length) {
    clearMarks(); tr.busy = true;
    if (tr.relearn) {
      sfx.relearn();
      say(`よく かけたね! 「${tr.k}」は ずかんに まだ のらないよ。すこし あとに もういちど チャレンジ!`);
    } else {
      sfx.done();
      const all = tr.qTotal > 0 && tr.qOk === tr.qTotal;
      say(`かんせい! 「${tr.k}」が かけたね 🎉` + (tr.qTotal ? `  ていねい ✨${tr.qOk}/${tr.qTotal}` : ""));
      if (all) { addStars(1); cheer("🌟"); setTimeout(sfx.sparkle, 450); }
    }
    speak(byN(cur.ans).r);
    setTimeout(finishTrace, 1300);
  } else {
    tr.busy = !!auto; sfx.stroke(i);
    const msgs = ["いいね!", "じょうず!", "そのちょうし!", "ばっちり!"];
    if (auto) setTimeout(() => { tr.busy = false; showNext(false); say(`つぎは ${tr.idx + 1}かくめ。●から やってみよう`); }, 1100);
    else { showNext(false); say(`${qmsg || msgs[i % msgs.length]} ${tip ? tip + "。" : ""}つぎは ${tr.idx + 1}かくめ ●から!`); }
  }
}
function thin(pts, gap) {          // 手のふるえで ふえた こまかい点を へらす
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const q = out[out.length - 1];
    if (Math.hypot(pts[i].x - q.x, pts[i].y - q.y) >= gap) out.push(pts[i]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function judge(user) {
  const K = TOL[state.set.level];
  const u = resample(thin(user, 4), N), ref = tr.refs[tr.idx];
  const lenOk = u.len > ref.len * 0.5 / K && u.len < (ref.len * 1.9 + 40) * K;
  const near = r => {
    const short = r.len < 45, tm = (short ? 11 : 17) * K, te = (short ? 15 : 24) * K;   // みじかい画は きびしめ
    const rs = r.pts[0], re = r.pts[N - 1], us = u.pts[0], ue = u.pts[N - 1];
    const dir = (ue.x - us.x) * (re.x - rs.x) + (ue.y - us.y) * (re.y - rs.y);   // むきが おなじか
    return meanDist(u.pts, r.pts) < tm && Math.hypot(us.x - rs.x, us.y - rs.y) < te
      && Math.hypot(ue.x - re.x, ue.y - re.y) < te && (Math.hypot(re.x - rs.x, re.y - rs.y) < 8 || dir > 0);
  };
  window.lastJ = `画${tr.idx + 1} 平均ずれ ${meanDist(u.pts, ref.pts).toFixed(1)} / 始点ずれ ${Math.hypot(u.pts[0].x - ref.pts[0].x, u.pts[0].y - ref.pts[0].y).toFixed(1)}`
    + ` / 終点ずれ ${Math.hypot(u.pts[N - 1].x - ref.pts[N - 1].x, u.pts[N - 1].y - ref.pts[N - 1].y).toFixed(1)} / 長さ比 ${(u.len / ref.len).toFixed(2)}`;
  if (lenOk && near(ref)) return { ok: true };
  for (let j = tr.idx + 1; j < tr.refs.length; j++) if (near(tr.refs[j])) return { why: "order", j };
  const rev = { pts: [...u.pts].reverse() };
  if (lenOk && meanDist(rev.pts, ref.pts) < (ref.len < 45 ? 11 : 17) * K) return { why: "reverse" };
  if (u.len < ref.len * 0.5 / K) return { why: "short" };
  const sd = Math.hypot(u.pts[0].x - ref.pts[0].x, u.pts[0].y - ref.pts[0].y);
  return { why: sd >= 24 * K ? "start" : "shape" };
}
function onMiss(r, user) {
  const bad = el("polyline", { points: user.map(p => `${p.x},${p.y}`).join(" ") }, "user bad");
  sv.appendChild(bad); bad.getBoundingClientRect(); bad.style.opacity = 0; setTimeout(() => bad.remove(), 700);
  tr.misses++; sfx.ng();
  const n = tr.idx + 1;
  const m = {
    order: `その ひつじゅんは ${r.j + 1}かくめ。さきに ${n}かくめ! ●から どうぞ`,
    reverse: `むきが はんたいだよ。●から はじめて すすむ ほうへ`,
    short: `もうすこし ながく ひいてね。●から さいごまで`,
    start: `はじまりは ●の ところから! ${n}かくめだよ`,
    shape: `おしい! ゆっくり おてほんの とおりに ひいてみよう`,
  }[r.why];
  if (tr.misses >= 4) {                   // 4かい つづけて むずかしいときは いっしょに かく
    say(`いっしょに かこうね。${n}かくめは こう!`); tr.busy = true; demo();
    setTimeout(() => acceptStroke(true), 1300);
    return;
  }
  say(m); if (state.set.autoDemo) demo();   // まちがえたら おてほんを みせて ガイド
}

function ptr(e) { const r = sv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 109, y: (e.clientY - r.top) / r.height * 109 }; }

    ? `<button data-act="crew" data-id="${m.id}" aria-label="${m.name}"><img src="img/c_${m.id}.webp" alt="${m.name}" width="44" height="44"></button>`
    : `<button class="lock" disabled title="あと ${m.at - gotCount()}じ">?</button>`).join("") + `</div>`;
  const head = `<div class="thead"><div><h3>🏘️ かんじの まち${(nUp || (nNew && built.length < cap)) ? '<span class="newdot">NEW</span>' : ""}</h3>
      <div class="tsub">たてもの ${built.length}/${cap}(かんじが ふえると ひろがるよ)</div></div>
      <button class="tchest ${canCollect ? "ready" : "done"}" data-act="collect"><img src="img/i_chest.webp" alt="" width="34" height="34">${built.length ? (canCollect ? `ごほうび ${coinImg}${tIncome()}` : "また あした!") : "まず たてよう"}</button></div>`;
  let grid = built.map(id => {
    const b = tDef(id), lv = T.b[id];
    return `<button class="tcell ${townSel === id ? "sel" : ""} ${townFlash === id ? "pop" : ""}" data-act="sel" data-id="${id}"><img src="${tImg(id, lv)}" alt="${b.name}" width="86" height="86" loading="lazy" decoding="async"><div>${b.name}</div><div class="tlv">Lv.${lv}${lv >= b.lv ? " ★" : ""}</div></button>`;
  }).join("");
  if (built.length < cap) grid += `<button class="tcell add ${townSel === "build" ? "sel" : ""}" data-act="build"><span class="plus">＋</span><span>たてる</span></button>`;
  let panel = "";
  if (townSel === "build") {
    const rows = TOWN.filter(b => !T.b[b.id]).map(b => ({ b, ok: tUnlocked(b) })).sort((x, y) => y.ok - x.ok);
    panel = `<div class="tpanel"><b>なにを たてる?</b><div class="blist">` + rows.map(({ b, ok }) => {
      const can = ok && state.stars >= b.cost[0];
      return ok
        ? `<div class="bi"><img src="${tImg(b.id, 1)}" alt="" width="52" height="52" loading="lazy"><div class="tx"><b>${b.name}</b><br>${b.k.map(c => `<span class="tchip">${c}</span>`).join("")}</div><button class="tbtn ${can ? "" : "off"}" data-act="make" data-id="${b.id}">${coinImg}${b.cost[0]} で たてる</button></div>`
        : `<div class="bi lock"><img src="${tImg(b.id, 1)}" alt="" width="52" height="52" loading="lazy"><div class="tx"><b>？？？</b><br>🔒 ${b.k.map(c => `「${c}」`).join("か")}を ゲットすると ひらくよ</div></div>`;
    }).join("") + `</div></div>`;
  } else if (townSel && T.b[townSel]) {
    const b = tDef(townSel), lv = T.b[townSel], c = tNextCost(townSel);
    panel = `<div class="tpanel"><div class="big"><img src="${tImg(townSel, lv)}" alt="${b.name}"><div class="info"><div class="nm">${b.name}</div>
      <div class="tlv">Lv.${lv} / ${b.lv}</div><div class="tsub">ひらいた かんじ: ${b.k.filter(k => state.got[kn(k)]).map(k => `<span class="tchip">${k}</span>`).join("")}</div>`
      + (c === null ? `<div style="margin-top:6px">🌟 さいだいレベル!</div>`
        : `<button class="tbtn ${state.stars >= c ? "" : "off"}" data-act="up" data-id="${townSel}">${coinImg}${c} で レベルアップ</button>`) + `</div></div></div>`;
  } else if (!built.length) {
    panel = `<div class="tpanel" style="text-align:center">まだ なにも ないよ。「＋ たてる」から はじめよう!</div>`;
  }
  $("town").innerHTML = head + crew + `<div class="tgrid">${grid}</div>` + panel;
  townFlash = null;
}
$("town").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, T = state.town;
  if (act === "sel") { sfx.tap(); townSel = townSel === id ? null : id; }
  else if (act === "build") { sfx.tap(); townSel = townSel === "build" ? null : "build"; }
  else if (act === "crew") {
    const m = CREW.find(x => x.id === id); b.classList.remove("hop"); void b.offsetWidth; b.classList.add("hop"); sfx.tap(); speak(m.say); toast(`${m.name}: ${m.say}`); return;
  } else if (act === "collect") {
    if (!tBuilt().length) { townSel = "build"; }
    else if (T.collect === todayStr()) { toast("きょうの ごほうびは もう もらったよ。また あした!"); return; }
    else { const n = tIncome(); T.collect = todayStr(); addStars(n); sfx.coin(); toast(`🎁 まちの ごほうび ⭐+${n}`); save(); renderZukan(); }
  } else if (act === "make") {
    const d = tDef(id);
    if (tBuilt().length >= tCap()) { sfx.ng(); toast("もう いっぱい。かんじを ふやすと ひろがるよ"); return; }
    if (state.stars < d.cost[0]) { sfx.ng(); toast(`⭐が たりないよ(あと ${d.cost[0] - state.stars}こ)`); return; }
    state.stars -= d.cost[0]; T.b[id] = 1; if (!T.order.includes(id)) T.order.push(id);
    townSel = id; townFlash = id; sfx.badge(); toast(`🏗️ ${d.name} が できたよ!`); checkBadges(); save(); renderZukan();
  } else if (act === "up") {
    const d = tDef(id), c = tNextCost(id);
    if (c === null) return;
    if (state.stars < c) { sfx.ng(); toast(`⭐が たりないよ(あと ${c - state.stars}こ)`); return; }
    state.stars -= c; T.b[id]++; townFlash = id; sfx.badge(); toast(`⬆️ ${d.name} が Lv.${T.b[id]} に なったよ!`); checkBadges(); save(); renderZukan();
  }
  townSig = ""; renderTown(); renderGame();
});

// ---- きろくの コード(コピーして とっておく / あとで もどす) ----
function makeCode() {
  const o = { v: 1, stars: state.stars, got: state.got, miss: state.miss, review: state.review, qn: state.qn,
    owned: state.owned, equip: state.equip, badges: state.badges, town: { b: state.town.b, order: state.town.order }, stat: { earned: state.stat.earned, bestCombo: state.stat.bestCombo, writes: state.stat.writes, revenge: state.stat.revenge, missions: state.stat.missions } };
  return "KJ1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function mergeCode(code) {          // いまの きろくに あわせる(あたらしいほうを のこす)。できなければ false
  const m = String(code).match(/KJ1:([A-Za-z0-9+/=]+)/);
  if (!m) return false;
  let o; try { o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { return false; }
  if (!o || typeof o !== "object" || typeof o.got !== "object") return false;
  const num = (x, hi) => (Number.isFinite(+x) ? Math.max(0, Math.min(hi, Math.floor(+x))) : 0);
  for (const k in o.got) { const n = +k, v = num(o.got[k], 9999); if (n >= 1 && n <= TOTAL && v > 0) state.got[n] = Math.max(state.got[n] || 0, v); }
  for (const k in (o.miss || {})) { const n = +k; if (n >= 1 && n <= TOTAL) state.miss[n] = Math.max(state.miss[n] || 0, num(o.miss[k], 99)); }
  for (const k in (o.review || {})) {
    const n = +k, v = o.review[k];
    if (n >= 1 && n <= TOTAL && v && !state.review[n]) state.review[n] = { at: num(v.at, 1e9), fails: num(v.fails, 99) || 1 };
  }
  for (const it of SHOP) {
    if (o.owned && o.owned[it.id]) state.owned[it.id] = 1;
    if (o.equip && o.equip[it.slot] === it.id && !state.equip[it.slot]) state.equip[it.slot] = it.id;
  }
  for (const b of BADGES) if (o.badges && o.badges[b.id] && !state.badges[b.id]) state.badges[b.id] = String(o.badges[b.id]).slice(0, 10);
  for (const k of ["earned", "bestCombo", "writes", "revenge", "missions"]) state.stat[k] = Math.max(state.stat[k] || 0, num(o.stat && o.stat[k], 1e6));
  if (o.town && o.town.b && typeof o.town.b === "object") {
    for (const b of TOWN) {
      const v = Math.min(num(o.town.b[b.id], b.lv), b.lv);
      if (v > 0) { state.town.b[b.id] = Math.max(state.town.b[b.id] || 0, v); if (!state.town.order.includes(b.id)) state.town.order.push(b.id); }
    }
    townSig = "";
  }
  state.stars = Math.max(state.stars, num(o.stars, 1e6));
  state.qn = Math.max(state.qn, num(o.qn, 1e9));
  save(); renderZukan(); renderGame(); applySettings();
  return true;
}
$("codeMake").addEventListener("click", () => { $("codeOut").value = makeCode(); $("codeOut").classList.remove("hidden"); $("codeCopy").classList.remove("hidden"); $("codeMsg").textContent = "コードが できたよ。コピーして メモや メッセージに とっておいてね"; });
$("codeCopy").addEventListener("click", async () => {
  const t = $("codeOut"); t.select();
  try { await navigator.clipboard.writeText(t.value); $("codeMsg").textContent = "コピーしたよ!"; }
  catch (e) { $("codeMsg").textContent = "コードを ながおしで えらんで コピーしてね"; }
});
$("codeApply").addEventListener("click", () => {
  const ok = mergeCode($("codeIn").value);
  $("codeMsg").textContent = ok ? `もどしたよ! ずかん ${Object.keys(state.got).length}字` : "コードが ただしくないよ。さいしょの「KJ1:」から ぜんぶ はりつけてね";
  if (ok) { $("codeIn").value = ""; }
});
function showStatus() {
  const t = state.savedAt ? new Date(state.savedAt).toLocaleString("ja-JP") : "まだ";
  $("saveStatus").textContent = storageOK ? `ほぞん: OK(さいごの ほぞん ${t})` : "ほぞん: できません(この がめんでは きろくが のこりません)";
  $("storageWarn").classList.toggle("hidden", storageOK);
}
$("gear").addEventListener("click", showStatus);
// localStorage が からっぽで IndexedDB に ひかえが あれば ふっかつ
if (!hadSaved) idbGet().then(v => {
  if (!v) return;
  try {
    const o = JSON.parse(v);
    if (!o || !o.got || !Object.keys(o.got).length) return;
    Object.assign(state, o);
    state.set = Object.assign({ level: 1, autoDemo: true, quality: true, debug: false, sound: true }, o.set || {});
    save(); renderZukan(); renderGame(); applySettings();
  } catch (e) {}
});
showStatus();

// ---- がめん(ホーム・べんきょう・まち・ずかん) ----
let curScreen = "home", prevScreen = "home", sess = null, sessSeq = 0;
function later(fn, ms) { const id = sessSeq; setTimeout(() => { if (id === sessSeq) fn(); }, ms); }   // やめたあとの タイマーを むこうに
const MODES = [
  { id: "mix", e: "🎲", n: "80じ ミックス", d: "ぜんぶの かんじから ランダムに", rec: 1 },
  { id: "read", e: "📖", n: "よみクイズ", d: "かんじの よみを えらぶ" },
  { id: "sent", e: "📝", n: "ぶんの かんじ", d: "ぶんの ＿に はいる かんじ" },
  { id: "nat", e: "🖼️", n: "えから かんじ", d: "えを みて かんじを えらぶ" },
  { id: "calc", e: "🔢", n: "けいさん", d: "かんじの たしざん・ひきざん" },
  { id: "opp", e: "↔️", n: "はんたいことば", d: "うえ ↔ した など" },
];
const COUNTS = [5, 10, 20, 0];
const modeOf = id => MODES.find(m => m.id === id) || MODES[0];
const countLabel = c => (c ? `${c}もん` : "ずっと");

function show(name) {
  curScreen = name;
  document.querySelectorAll(".screen").forEach(el => el.classList.toggle("on", el.id === "s-" + name));
  const navKey = (name === "session" || name === "result") ? "study" : name;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === navKey));
  $("nav").classList.toggle("hidden", name === "session");
  window.scrollTo(0, 0);
  if (name === "home") renderGame();
  if (name === "study") renderStudy();
  if (name === "town") { townSig = ""; renderTown(); }
  if (name === "zukan") { renderZukan(); renderRewards(); }
  if (name === "settings") showStatus();
}
document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => {
  sfx.tap();
  if (curScreen === "session" && sess) return;           // べんきょう ちゅうは ナビを つかえない
  show(b.dataset.go);
}));
$("backBtn").addEventListener("click", () => { sfx.tap(); show(prevScreen === "settings" ? "home" : prevScreen); });

function renderHomeExtras() {
  const m = modeOf(state.study.mode);
  $("quickGo").textContent = `つづき: ${m.e} ${m.n} ${countLabel(state.study.count)} ▶`;
  const T = state.town, built = tBuilt(), today = todayStr();
  const canCollect = built.length > 0 && T.collect !== today;
  const nUp = built.filter(id => { const c = tNextCost(id); return c !== null && state.stars >= c; }).length;
  const nNew = TOWN.filter(b => !T.b[b.id] && tUnlocked(b) && state.stars >= b.cost[0]).length;
  const best = built.length ? built[built.length - 1] : null;
  const img = best ? tImg(best, T.b[best]) : "img/i_hammer.webp";
  const msg = !built.length ? "まちを つくろう!" : canCollect ? "ごほうびが もらえるよ!" : (nUp || (nNew && built.length < tCap())) ? "レベルアップ できるよ!" : "まちを みにいこう";
  $("homeTown").innerHTML = `<img src="${img}" alt="" width="52" height="52"><span class="tx"><b>🏘️ かんじの まち</b><small>たてもの ${built.length}こ ・ ${msg}</small></span><span>▶</span>`;
  $("navTownDot").classList.toggle("hidden", !(canCollect || nUp || (nNew && built.length < tCap())));
}
$("goStudy").addEventListener("click", () => { sfx.tap(); show("study"); });
$("quickGo").addEventListener("click", () => { sfx.tap(); startSession(); });
$("homeTown").addEventListener("click", () => { sfx.tap(); show("town"); });

function renderStudy() {
  $("modeGrid").innerHTML = MODES.map(m => `<button class="mcard ${state.study.mode === m.id ? "on" : ""}" data-mode="${m.id}">${m.rec ? '<span class="rec">おすすめ</span>' : ""}<span class="me">${m.e}</span><span class="mn">${m.n}</span><span class="md">${m.d}</span></button>`).join("");
  $("countRow").innerHTML = COUNTS.map(c => `<button class="ccard ${state.study.count === c ? "on" : ""}" data-count="${c}">${c ? c : "∞"}<small>${c ? "もん" : "ずっと"}</small></button>`).join("");
  const m = modeOf(state.study.mode);
  $("startBtn").textContent = `▶ はじめる(${countLabel(state.study.count)})`;
}
$("modeGrid").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (!b) return; sfx.tap(); state.study.mode = b.dataset.mode; save(); renderStudy(); });
$("countRow").addEventListener("click", e => { const b = e.target.closest("[data-count]"); if (!b) return; sfx.tap(); state.study.count = +b.dataset.count; save(); renderStudy(); });
$("startBtn").addEventListener("click", () => { sfx.tap(); startSession(); });

function startSession() {
  const { mode, count } = state.study;
  sessSeq++; state.mode = mode; save();
  sess = { mode, count, done: 0, ok1: 0, newN: 0, comboBest: 0, earned0: state.stat.earned };
  combo = 0; quitArmed = false; $("quitBtn").textContent = "✕ やめる";
  show("session"); renderSessHead(); newQuestion();
}
function renderSessHead() {
  if (!sess) return;
  $("sessInfo").textContent = sess.count ? `${sess.done + 1} / ${sess.count} もんめ` : `${sess.done + 1} もんめ`;
  $("sessBar").style.width = (sess.count ? sess.done / sess.count * 100 : 0) + "%";
}
function afterQuestion() {
  if (!sess) return;
  sess.done++;
  if (sess.count && sess.done >= sess.count) { showResult(); return; }
  renderSessHead(); newQuestion();
}
let quitArmed = false, quitTimer = null;
$("quitBtn").addEventListener("click", () => {
  if (!quitArmed) {
    quitArmed = true; $("quitBtn").textContent = "ほんとうに やめる?";
    quitTimer = setTimeout(() => { quitArmed = false; $("quitBtn").textContent = "✕ やめる"; }, 3000);
    return;
  }
  clearTimeout(quitTimer); quitArmed = false; sessSeq++;
  const s = sess; sess = null; tr = null; locked = true;
  if (s && s.done > 0 && s.count) { sess = s; showResult(true); return; }   // 1もんでも おわっていれば けっかを みせる
  show("home");
});
function showResult(quit) {
  const sv0 = sess; sess = null; tr = null;
  const done = Math.max(sv0.done, 1), total = quit ? done : (sv0.count || done);
  const acc = sv0.ok1 / done, rating = acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1;
  const earned = state.stat.earned - sv0.earned0, rc = Object.keys(state.review).length;
  const can = tBuilt().some(id => { const c = tNextCost(id); return c !== null && state.stars >= c; }) || TOWN.some(b => !state.town.b[b.id] && tUnlocked(b) && state.stars >= b.cost[0]);
  $("s-result").innerHTML = `<section class="card result">
      <div class="rbig">${"⭐".repeat(rating)}${"☆".repeat(3 - rating)}</div>
      <h2>${quit ? "ここまで おつかれさま!" : rating === 3 ? "すごい! かんぺき!" : rating === 2 ? "よく がんばったね!" : "つぎは もっと できるよ!"}</h2>
      <div class="rstat"><span>1かいで せいかい</span><b>${sv0.ok1} / ${total}</b></div>
      <div class="rstat"><span>あたらしい かんじ</span><b>${sv0.newN} こ</b></div>
      <div class="rstat"><span>ベスト コンボ</span><b>🔥 ${sv0.comboBest}</b></div>
      <div class="rstat"><span>ゲットした ⭐</span><b>+${earned}</b></div>
      <div class="rstat"><span>おぼえなおし のこり</span><b>🔁 ${rc} こ</b></div>
    </section>
    <button class="big-btn cta" id="rAgain">もういちど</button>
    ${can ? '<button class="big-btn sub" id="rTown">🏘️ ⭐で まちを そだてる</button>' : ""}
    <button class="big-btn sub" id="rOther">ほかの べんきょう</button>
    <button class="big-btn sub" id="rHome">🏠 ホームへ</button>`;
  show("result"); sfx.done(); if (rating === 3) setTimeout(sfx.sparkle, 350);
  $("rAgain").onclick = () => { sfx.tap(); startSession(); };
  if ($("rTown")) $("rTown").onclick = () => { sfx.tap(); show("town"); };
  $("rOther").onclick = () => { sfx.tap(); show("study"); };
  $("rHome").onclick = () => { sfx.tap(); show("home"); };
}

renderZukan();
renderGame();
show("home");
</script>
</body>
</html>
