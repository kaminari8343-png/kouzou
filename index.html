<title>かんじ けいさん</title>
<style>
  :root {
    --bg: #fff8e1; --ink: #3e2723; --card: #ffffff; --main: #ff8f00;
    --ok: #43a047; --ng: #e53935; --soft: #ffe0b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; }
  body { display: flex; justify-content: center; }
  #app { width: 100%; max-width: 560px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  @media (display-mode: standalone) {      /* ホーム画面から ひらいた とき(ノッチを さける) */
    #app { padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  }
  h1 { margin: 4px 0; font-size: 1.6rem; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: 0 4px 0 var(--soft); }
  .big-btn { font: inherit; font-size: 1.6rem; border: 0; border-radius: 18px; padding: 16px 20px;
    background: var(--main); color: #fff; box-shadow: 0 5px 0 #c66900; cursor: pointer; width: 100%; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c66900; }
  .big-btn.sub { background: #8d6e63; box-shadow: 0 5px 0 #5d4037; font-size: 1.2rem; }
  .tabs { display: flex; gap: 8px; }
  .tab { font: inherit; font-size: 1.1rem; padding: 10px 4px; border: 3px solid var(--soft);
    border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; }
  .tab.on { background: var(--main); border-color: var(--main); color: #fff; }
  .pet { text-align: center; font-size: 1rem; }
  .pet .e { font-size: 2.6rem; display: block; line-height: 1.1; }
  .pic { font-size: 4.2rem; line-height: 1; }
  .morph { animation: morph 1s ease-in-out; }
  @keyframes morph { 0% { transform: scale(1) rotate(0); opacity: 1; } 45% { transform: scale(.2) rotate(180deg); opacity: 0; }
    55% { transform: scale(.2) rotate(180deg); opacity: 0; } 100% { transform: scale(1) rotate(360deg); opacity: 1; } }
  .choice.txt .k { font-size: 2rem; padding: 10px 0; }
  .tabs { flex-wrap: wrap; }
  .tab { flex: 1 1 45%; }
  .hidden { display: none !important; }

  /* mondai */
  #formula { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
  .num { text-align: center; }
  .num .k { font-size: 4.2rem; line-height: 1; }
  .num .r { font-size: .95rem; color: #8d6e63; }
  .op { font-size: 3rem; }
  .q { font-size: 4.2rem; color: var(--main); }
  #hint { text-align: center; font-size: 1.1rem; min-height: 1.6em; }
  #choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choice { font: inherit; background: #fff; border: 4px solid var(--soft); border-radius: 18px;
    padding: 6px 0; cursor: pointer; text-align: center; }
  .choice .k { font-size: 3rem; display: block; line-height: 1.1; }
  .choice .r { font-size: .85rem; color: #8d6e63; }
  .choice.ok { border-color: var(--ok); background: #e8f5e9; }
  .choice.ng { border-color: var(--ng); background: #ffebee; animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* nazori */
  #traceMsg { text-align: center; font-size: 1.2rem; margin: 0 0 8px; }
  #pad { position: relative; width: 100%; aspect-ratio: 1; border: 4px dashed var(--soft); border-radius: 16px; background: #fffdf7; }
  #sv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #sv path, #sv polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ghost { stroke: #e6dcd5; stroke-width: 6; }
  .done { stroke: #ff8f00; stroke-width: 6; }
  .demo { stroke: #1e88e5; stroke-width: 6; }
  .user { stroke: #1e88e5; stroke-width: 5; opacity: .85; }
  .user.bad { stroke: #e53935; transition: opacity .6s; opacity: 0; }
  .startdot { fill: #1e88e5; animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .startnum { fill: #fff; font-size: 7px; font-weight: bold; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  @keyframes pulse { 50% { transform: scale(1.35); } }
  .opt { display: block; margin: 8px 0; font-size: 1rem; }
  .opt label { margin-right: 8px; }
  .endtag { font-size: 5px; font-weight: bold; fill: #1e88e5; paint-order: stroke; stroke: #fffdf7; stroke-width: 1.2px; }
  #dbg { font: 11px/1.4 monospace; color: #6d4c41; white-space: pre-wrap; margin-top: 8px; }
  #learn { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    background: #fff3e0; border: 3px dashed var(--main); border-radius: 16px; padding: 8px 12px; margin-bottom: 8px; }
  #learn .lk { font-size: 3rem; line-height: 1; }
  #learn .lr { font-size: 1.3rem; font-weight: bold; }
  #learn .lx { font-size: 1rem; color: #8d6e63; width: 100%; text-align: center; }
  .z.rv { background: #fff0e0; color: #c98a45; outline: 2px dashed var(--main); outline-offset: -2px; }
  .z.rv .k { opacity: .75; }
  #rvLine { text-align: center; font-size: .95rem; color: #c66900; }
  .sent { font-size: 1.7rem; line-height: 1.6; text-align: center; padding: 8px 0; }
  .blank { display: inline-block; min-width: 1.6em; color: var(--main); border-bottom: 4px solid var(--main); }
  .credit { text-align: center; font-size: .7rem; color: #a1887f; margin: 4px 0 12px; }
  .row { display: flex; gap: 10px; margin-top: 10px; }

  /* zukan */
  #zukan { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .z { text-align: center; border-radius: 12px; padding: 4px 0; background: #eee; color: #bbb; }
  .z .k { font-size: 1.35rem; line-height: 1.1; display: block; }
  .z .r { font-size: .5rem; white-space: nowrap; overflow: hidden; }
  .z.got { background: #fff3c4; color: var(--ink); }
  .z .c { font-size: .5rem; }

  #cheer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 4rem; pointer-events: none; opacity: 0; }
  #cheer.show { animation: pop 1s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1.2); }
    80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
</style>
</head>
<body>
<div id="app">
  <h1>かんじ けいさん <button id="sndBtn" aria-label="おと" style="font-size:1.3rem;border:0;background:none;cursor:pointer">🔊</button><button id="gear" aria-label="せってい" style="font-size:1.3rem;border:0;background:none;cursor:pointer">⚙️</button></h1>

    <div class="opt"><b>きろくの バックアップ</b><br>
      <span id="saveStatus" style="font-size:.85rem;color:#8d6e63"></span>
      <div class="row" style="margin-top:6px">
        <button class="big-btn sub" id="codeMake" style="font-size:1rem;padding:10px">コードを つくる</button>
        <button class="big-btn sub hidden" id="codeCopy" style="font-size:1rem;padding:10px">コピー</button>
      </div>
      <textarea id="codeOut" class="hidden" readonly rows="3" style="width:100%;margin-top:6px;font:11px monospace;-webkit-user-select:text;user-select:text"></textarea>
      <textarea id="codeIn" rows="2" placeholder="とっておいた コードを ここに はる" style="width:100%;margin-top:6px;font:11px monospace;-webkit-user-select:text;user-select:text"></textarea>
      <button class="big-btn sub" id="codeApply" style="font-size:1rem;padding:10px;margin-top:6px">このコードで もどす(いまの きろくに あわせる)</button>
      <div id="codeMsg" style="font-size:.9rem;margin-top:4px"></div>
    </div>
    <button class="big-btn sub" id="resetBtn" style="font-size:1rem;padding:10px">きろくを ぜんぶ けす</button>
  </section>
  <div class="bar"><span>⭐ <b id="stars">0</b></span><span>ずかん <b id="gotCount">0</b>/<span id="totalCount">80</span></span></div>
  <div class="pet"><span class="e" id="petE"></span><span id="petT"></span></div>
  <div id="storageWarn" class="hidden" style="background:#ffebee;color:#c62828;border-radius:12px;padding:8px 12px;font-size:.9rem">⚠️ この がめんでは あそんだ きろくが のこりません。ふつうの ブラウザで ひらいてね(おうちのひとへ: ⚙️ の コードで きろくを とっておけます)</div>
  <div id="rvLine" class="hidden"></div>
  <div class="tabs">
    <button id="tabCalc" class="tab">🔢 けいさん</button>
    <button id="tabOpp" class="tab">↔ はんたいことば</button>
    <button id="tabNat" class="tab">🖼️ えから かんじ</button>
    <button id="tabRead" class="tab">📖 よみクイズ</button>
    <button id="tabSent" class="tab">📝 ぶんの かんじ</button>
    <button id="tabMix" class="tab">🎲 80じ ミックス</button>
  </div>

  <!-- もんだい -->
  <section id="quiz" class="card">
    <div id="formula"></div>
    <p id="hint"></p>
    <div id="choices"></div>
  </section>

  <!-- なぞりがき -->
  <section id="trace" class="card hidden">
    <div id="learn" class="hidden"></div>
    <p id="traceMsg"></p>
    <div id="pad"><svg id="sv" viewBox="0 0 109 109"></svg></div>
    <div id="dbg" class="hidden"></div>
    <div class="row">
      <button class="big-btn sub" id="hintBtn">👀 おてほん</button>
      <button class="big-btn sub" id="clearBtn">🔄 やりなおし</button>
    </div>
  </section>

  <!-- ずかん -->
  <section class="card">
    <div style="text-align:center;margin-bottom:6px">かんじずかん</div>
    <div id="zukan"></div>
  </section>
  <p class="credit">かきじゅんデータ: KanjiVG (CC BY-SA 3.0) <a href="https://kanjivg.tagaini.net">kanjivg.tagaini.net</a></p>
</div>

// 苦手な答えが出やすくなる重み付き抽選
function weighted(pool) {
  let x = Math.random() * pool.reduce((t, q) => t + q.w, 0);
  for (const q of pool) { x -= q.w; if (x <= 0) return q; }
  return pool[0];
}
function calcPool() {
  const pool = [];
  for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++) {
    const ans = a + b;
    pool.push({ a, b, ans, op: "+", mode: "calc", w: 1 + (state.miss[ans] || 0) * 2 });
  }
  for (let a = 2; a <= 10; a++) for (let b = 1; b < a; b++) {
    const ans = a - b;
    pool.push({ a, b, ans, op: "-", mode: "calc", w: 1 + (state.miss[ans] || 0) * 2 });
  }
  return pool;
}
function inPool(mode, n) {          // その モードで n が こたえに なる もんだいが つくれるか
  return mode === "nat" ? PIC.some(d => d.n === n) : mode === "opp" ? OPP.some(d => d.n === n)
    : mode === "calc" ? n <= 10 : true;     // read / sent / mix は 80字ぜんぶ
}
function modesFor(n) { return ["read", "sent", "calc", "opp", "nat"].filter(m => inPool(m, n)); }
function buildQ(mode, n) {          // n を こたえに する もんだい
  if (mode === "calc") { const c = calcPool().filter(q => q.ans === n); return Object.assign({}, c[Math.floor(Math.random() * c.length)]); }
  if (mode === "opp") return { a: partner(n), ans: n, mode };
  return { a: n, ans: n, mode };
}
function reviewPick() {             // 「おぼえなおし」の じかんが きた字(あれば いちばん ふるい 1つ)
  const due = Object.keys(state.review).map(Number)
    .filter(n => state.review[n].at <= state.qn && inPool(state.mode, n))
    .sort((a, b) => state.review[a].at - state.review[b].at);
  if (!due.length || Math.random() > 0.85) return null;
  const n = due[0], ms = state.mode === "mix" ? modesFor(n) : [state.mode];
  return Object.assign(buildQ(ms[Math.floor(Math.random() * ms.length)], n), { retry: true });
}
function pickQuestion() {
  const rv = reviewPick();
  if (rv) return rv;
  if (state.mode === "mix") {       // 80字ぜんぶから。まだ のっていない字と にがてな字を おおめに
    const q = weighted(ALL.map(d => ({ n: d.n, w: 1 + (state.miss[d.n] || 0) * 2 + (state.got[d.n] ? 0 : 2) })));
    const ms = modesFor(q.n);
    return buildQ(ms[Math.floor(Math.random() * ms.length)], q.n);
  }
  if (state.mode === "nat" || state.mode === "read" || state.mode === "sent") {
    const src = state.mode === "nat" ? PIC : ALL;
    return weighted(src.map(d => ({ a: d.n, ans: d.n, mode: state.mode, w: 1 + (state.miss[d.n] || 0) * 2 })));
  }
  if (state.mode === "opp") {
    const pool = OPP.map(d => ({ a: d.n, ans: partner(d.n), mode: "opp", w: 1 + (state.miss[partner(d.n)] || 0) * 2 }));
    let x = Math.random() * pool.reduce((t, q) => t + q.w, 0);
    for (const q of pool) { x -= q.w; if (x <= 0) return q; }
    return pool[0];
  }
  return weighted(calcPool());
}

const NS = "http://www.w3.org/2000/svg", sv = $("sv");
const N = 16;                      // 比べるときの点の数
let tr = null;                     // 練習中の状態

function el(name, attrs, cls) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (cls) e.setAttribute("class", cls);
  return e;
}
function resample(pts, n) {        // 長さで等間隔に取り直す
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const total = L[L.length - 1], out = [];
  for (let i = 0, j = 1; i < n; i++) {
    const t = total * i / (n - 1);
    while (j < pts.length - 1 && L[j] < t) j++;
    const span = L[j] - L[j - 1] || 1, f = Math.min(1, Math.max(0, (t - L[j - 1]) / span));
    out.push({ x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * f, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * f });
  }
  return { pts: out, len: total };
}
function meanDist(a, b) { let t = 0; for (let i = 0; i < a.length; i++) t += Math.hypot(a[i].x - b[i].x, a[i].y - b[i].y); return t / a.length; }

  const p = el("path", { d }), L = p.getTotalLength(), raw = [];
  for (let i = 0; i <= 40; i++) { const q = p.getPointAtLength(L * i / 40); raw.push({ x: q.x, y: q.y }); }
  return resample(raw, N);
}

const HOOK = "㇚㇁㇆㇖㇟㇈㇂㇃㇉", SWEEP = "㇒㇓㇏㇀", STOP = "㇐㇑㇕㇄";
function strokeKind(type) {         // はね / はらい / とめ / (みない)
  if (!type || type.includes("/")) return null;
  const c = type[0];
  return HOOK.includes(c) ? "hook" : SWEEP.includes(c) ? "sweep" : STOP.includes(c) ? "stop" : null;
}
const KIND_LABEL = { hook: "はね", sweep: "はらい", stop: "とめ" };
function arcAt(pts, f) {            // 長さの f(0〜1) の ところの 点
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const t = L[L.length - 1] * f;
  let j = 1; while (j < pts.length - 1 && L[j] < t) j++;
  const span = L[j] - L[j - 1] || 1, g = Math.min(1, Math.max(0, (t - L[j - 1]) / span));
  return { x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * g, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * g,
           t: (pts[j - 1].t ?? 0) + ((pts[j].t ?? 0) - (pts[j - 1].t ?? 0)) * g, total: L[L.length - 1] };
}
function hookTurn(pts) {            // さいごの むきが どれだけ まがったか(度)。+/- は まがる ほうこう
  const a = arcAt(pts, .45), b = arcAt(pts, .85), c = arcAt(pts, .93), e = pts[pts.length - 1];
  if (Math.hypot(e.x - c.x, e.y - c.y) < 1.5) return 0;
  let t = (Math.atan2(e.y - c.y, e.x - c.x) - Math.atan2(b.y - a.y, b.x - a.x)) * 180 / Math.PI;
  while (t > 180) t -= 360; while (t < -180) t += 360;
  return t;
}
function tailRatio(pts) {           // さいごの 25% の はやさ ÷ ぜんたいの はやさ(1より小さい=ゆっくり とまった)
  const s = pts[0], q = arcAt(pts, .75), e = pts[pts.length - 1];
  const dtAll = (e.t ?? 0) - (s.t ?? 0), dtTail = (e.t ?? 0) - q.t;
  if (!(dtAll > 30) || !(dtTail > 5)) return null;
  const tailLen = q.total * .25;
  return (tailLen / dtTail) / (q.total / dtAll);
}
function quality(userPts, meta) {   // { kind, ok:true/false/null, info }
  if (!meta.kind) return { kind: null };
  if (meta.kind === "hook") {
    const ut = hookTurn(userPts);
    return { kind: "hook", ok: Math.abs(ut) >= 35 && Math.sign(ut) === Math.sign(meta.turn), info: `hook ${Math.round(ut)}° (おてほん ${Math.round(meta.turn)}°)` };
  }
  const r = tailRatio(userPts);
  if (r === null) return { kind: meta.kind, ok: null, info: "speed n/a" };
  return { kind: meta.kind, ok: meta.kind === "sweep" ? r >= .6 : r <= .75, info: `tail速度比 ${r.toFixed(2)}` };
}

function startTrace() {
  const d = byN(cur.ans);
  $("quiz").classList.add("hidden");
  $("trace").classList.remove("hidden");
  const ds = window.STROKES && STROKES[d.k];
  if (!ds) { finishTrace(); return; }      // データがない字は そのまま ずかんへ
  sv.innerHTML = "";
  const types = (window.STROKE_TYPES && STROKE_TYPES[d.k]) || [];
  const meta = ds.map((x, i) => {
    const kind = strokeKind(types[i]), path = el("path", { d: x }), L = path.getTotalLength(), raw = [];
    for (let j = 0; j <= 60; j++) { const q = path.getPointAtLength(L * j / 60); raw.push({ x: q.x, y: q.y }); }
    return { kind, turn: kind === "hook" ? hookTurn(raw) : 0, end: raw[60] };
  });
  const relearn = !!cur.missed;
  $("learn").classList.toggle("hidden", !relearn);
  if (relearn) {
    const ctx = cur.mode === "calc" ? `${byN(cur.a).k} ${cur.op === "+" ? "+" : "−"} ${byN(cur.b).k} = ${d.k}`
      : cur.mode === "opp" ? `${byN(cur.a).k} ↔ ${d.k}`
      : cur.mode === "sent" ? SENT[d.k].split("|")[0].replace("＿", d.k) : "";
    $("learn").innerHTML = `<span class="lk">${d.k}</span><span class="lr">「${d.r}」</span>${d.e ? `<span class="lk" style="font-size:2.2rem">${d.e}</span>` : ""}`
      + (ctx ? `<span class="lx">${ctx}</span>` : "") + `<span class="lx">よく みて、かきじゅんを おぼえよう</span>`;
    speak(d.r);
  }
  tr = { relearn, ds, refs: ds.map(refPoints), meta, idx: 0, misses: 0, busy: false, user: null, k: d.k, qOk: 0, qTotal: 0 };
  ds.forEach(x => sv.appendChild(el("path", { d: x }, "ghost")));
  showNext(state.set.autoDemo || relearn);
}
function say(t) { $("traceMsg").textContent = t; }
function clearMarks() { sv.querySelectorAll(".startdot,.startnum,.demo,.endtag").forEach(e => e.remove()); }
function showNext(withDemo) {
  clearMarks();
  const i = tr.idx, st = tr.refs[i].pts[0];
  sv.appendChild(el("circle", { cx: st.x, cy: st.y, r: 6 }, "startdot"));
  const t = el("text", { x: st.x, y: st.y }, "startnum"); t.textContent = i + 1; sv.appendChild(t);
  const m = tr.meta[i];
  if (state.set.quality && m.kind) {
    const tg = el("text", { x: Math.min(100, Math.max(4, m.end.x + 3)), y: Math.min(106, Math.max(6, m.end.y + 5)) }, "endtag");
    tg.textContent = KIND_LABEL[m.kind]; sv.appendChild(tg);
  }
  say(`「${tr.k}」 ${i + 1}かくめ(${tr.ds.length}かくの うち)  ●から ひとふで!`);
  if (withDemo) demo();
}
function demo() {                         // おてほん: 筆の動きをアニメーションで見せる
  sv.querySelectorAll(".demo").forEach(e => e.remove());
  const dp = el("path", { d: tr.ds[tr.idx], pathLength: 1 }, "demo");
  dp.style.strokeDasharray = 1; dp.style.strokeDashoffset = 1;
  sv.appendChild(dp);
  dp.getBoundingClientRect();
  dp.style.transition = "stroke-dashoffset 1.1s ease-in-out"; dp.style.strokeDashoffset = 0;
  setTimeout(() => dp.remove(), 1800);
}
function acceptStroke(auto, userPts) {
  const i = tr.idx, dp = el("path", { d: tr.ds[i], pathLength: 1 }, "done");
  dp.style.strokeDasharray = 1; dp.style.strokeDashoffset = auto ? 1 : 0;   // 自動のときは なぞって見せる
  sv.appendChild(dp);
  if (auto) { dp.getBoundingClientRect(); dp.style.transition = "stroke-dashoffset .9s"; dp.style.strokeDashoffset = 0; }
  // はね・はらい・とめ (ほめるだけ。ダメだしで とめない)
  let qmsg = "", tip = "";
  if (!auto && state.set.quality && userPts) {
    const q = quality(userPts, tr.meta[i]);
    if (q.ok !== null && q.kind) {
      if (q.kind !== "stop") { tr.qTotal++; if (q.ok) tr.qOk++; }   // 「とめ」は ほめるだけ(点数に いれない)
      if (q.ok) qmsg = { hook: "✨ はねも ばっちり!", sweep: "✨ すーっと はらえたね!", stop: "✨ ぴたっと とまったね!" }[q.kind];
      else tip = { hook: "ここは さいごに ピッと はねると もっと いいよ", sweep: "ここは さいごまで すーっと はらうと もっと いいよ", stop: "" }[q.kind];
    }
    window.lastQ = q.info;
  }
  tr.idx++; tr.misses = 0;
  if (tr.idx >= tr.ds.length) {
    clearMarks(); tr.busy = true;
    if (tr.relearn) {
      sfx.relearn();
      say(`よく かけたね! 「${tr.k}」は ずかんに まだ のらないよ。すこし あとに もういちど チャレンジ!`);
    } else {
      sfx.done();
      const all = tr.qTotal > 0 && tr.qOk === tr.qTotal;
      say(`かんせい! 「${tr.k}」が かけたね 🎉` + (tr.qTotal ? `  ていねい ✨${tr.qOk}/${tr.qTotal}` : ""));
      if (all) { state.stars += 1; cheer("🌟"); setTimeout(sfx.sparkle, 450); }
    }
    speak(byN(cur.ans).r);
    setTimeout(finishTrace, 1300);
  } else {
    tr.busy = !!auto; sfx.stroke(i);
    const msgs = ["いいね!", "じょうず!", "そのちょうし!", "ばっちり!"];
    if (auto) setTimeout(() => { tr.busy = false; showNext(false); say(`つぎは ${tr.idx + 1}かくめ。●から やってみよう`); }, 1100);
    else { showNext(false); say(`${qmsg || msgs[i % msgs.length]} ${tip ? tip + "。" : ""}つぎは ${tr.idx + 1}かくめ ●から!`); }
  }
}
function thin(pts, gap) {          // 手のふるえで ふえた こまかい点を へらす
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const q = out[out.length - 1];
    if (Math.hypot(pts[i].x - q.x, pts[i].y - q.y) >= gap) out.push(pts[i]);
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function judge(user) {
  const K = TOL[state.set.level];
  const u = resample(thin(user, 4), N), ref = tr.refs[tr.idx];
  const lenOk = u.len > ref.len * 0.5 / K && u.len < (ref.len * 1.9 + 40) * K;
  const near = r => {
    const short = r.len < 45, tm = (short ? 11 : 17) * K, te = (short ? 15 : 24) * K;   // みじかい画は きびしめ
    const rs = r.pts[0], re = r.pts[N - 1], us = u.pts[0], ue = u.pts[N - 1];
    const dir = (ue.x - us.x) * (re.x - rs.x) + (ue.y - us.y) * (re.y - rs.y);   // むきが おなじか
    return meanDist(u.pts, r.pts) < tm && Math.hypot(us.x - rs.x, us.y - rs.y) < te
      && Math.hypot(ue.x - re.x, ue.y - re.y) < te && (Math.hypot(re.x - rs.x, re.y - rs.y) < 8 || dir > 0);
  };
  window.lastJ = `画${tr.idx + 1} 平均ずれ ${meanDist(u.pts, ref.pts).toFixed(1)} / 始点ずれ ${Math.hypot(u.pts[0].x - ref.pts[0].x, u.pts[0].y - ref.pts[0].y).toFixed(1)}`
    + ` / 終点ずれ ${Math.hypot(u.pts[N - 1].x - ref.pts[N - 1].x, u.pts[N - 1].y - ref.pts[N - 1].y).toFixed(1)} / 長さ比 ${(u.len / ref.len).toFixed(2)}`;
  if (lenOk && near(ref)) return { ok: true };
  for (let j = tr.idx + 1; j < tr.refs.length; j++) if (near(tr.refs[j])) return { why: "order", j };
  const rev = { pts: [...u.pts].reverse() };
  if (lenOk && meanDist(rev.pts, ref.pts) < (ref.len < 45 ? 11 : 17) * K) return { why: "reverse" };
  if (u.len < ref.len * 0.5 / K) return { why: "short" };
  const sd = Math.hypot(u.pts[0].x - ref.pts[0].x, u.pts[0].y - ref.pts[0].y);
  return { why: sd >= 24 * K ? "start" : "shape" };
}
function onMiss(r, user) {
  const bad = el("polyline", { points: user.map(p => `${p.x},${p.y}`).join(" ") }, "user bad");
  sv.appendChild(bad); bad.getBoundingClientRect(); bad.style.opacity = 0; setTimeout(() => bad.remove(), 700);
  tr.misses++; sfx.ng();
  const n = tr.idx + 1;
  const m = {
    order: `その ひつじゅんは ${r.j + 1}かくめ。さきに ${n}かくめ! ●から どうぞ`,
    reverse: `むきが はんたいだよ。●から はじめて すすむ ほうへ`,
    short: `もうすこし ながく ひいてね。●から さいごまで`,
    start: `はじまりは ●の ところから! ${n}かくめだよ`,
    shape: `おしい! ゆっくり おてほんの とおりに ひいてみよう`,
  }[r.why];
  if (tr.misses >= 4) {                   // 4かい つづけて むずかしいときは いっしょに かく
    say(`いっしょに かこうね。${n}かくめは こう!`); tr.busy = true; demo();
    setTimeout(() => acceptStroke(true), 1300);
    return;
  }
  say(m); if (state.set.autoDemo) demo();   // まちがえたら おてほんを みせて ガイド
}

function ptr(e) { const r = sv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 109, y: (e.clientY - r.top) / r.height * 109 }; }
sv.addEventListener("pointerdown", e => {
  if (!tr || tr.busy) return;
  sv.setPointerCapture(e.pointerId);
  const p = ptr(e); p.t = e.timeStamp;
  tr.user = { pts: [p], line: el("polyline", { points: `${p.x},${p.y}` }, "user") };
  sv.appendChild(tr.user.line);
});
sv.addEventListener("pointermove", e => {
  if (!tr || !tr.user) return;
  const p = ptr(e); p.t = e.timeStamp; tr.user.pts.push(p);
  tr.user.line.setAttribute("points", tr.user.pts.map(q => `${q.x},${q.y}`).join(" "));
});
function endStroke() {
  if (!tr || !tr.user) return;
  const u = tr.user; tr.user = null; u.line.remove();
  if (u.pts.length < 3) { say("ゆびを すべらせて ひいてね"); return; }
  const r = judge(u.pts);
  const kept = u.pts;
  if (r.ok) acceptStroke(false, thin(kept, 2)); else onMiss(r, kept);
  if (state.set.debug) $("dbg").textContent = `${window.lastJ}\n判定: ${r.ok ? "OK" : r.why}${window.lastQ ? "\n" + window.lastQ : ""}`;
}
["pointerup", "pointercancel"].forEach(t => sv.addEventListener(t, endStroke));
$("hintBtn").addEventListener("click", () => { sfx.tap(); if (tr && !tr.busy) { demo(); say(`${tr.idx + 1}かくめは こう! ●から ひいてね`); } });
$("clearBtn").addEventListener("click", () => { if (tr && !tr.busy) startTrace(); });

function finishTrace() {
  const relearn = tr && tr.relearn;
  tr = null;
  const n = cur.ans;
  $("learn").classList.add("hidden");
  if (relearn) {                    // まちがえた もんだい: ずかんには のせない。あとで もういちど
    const fails = ((state.review[n] && state.review[n].fails) || 0) + 1;
    state.review[n] = { at: state.qn + Math.min(3 + 2 * (fails - 1), 9), fails };
    save(); renderZukan();
    cheer("🔁");
    setTimeout(newQuestion, 900);
    return;
  }
  const before = stageIdx(Object.keys(state.got).length);
  state.got[n] = (state.got[n] || 0) + 1;
  const evolved = stageIdx(Object.keys(state.got).length) > before;
  state.stars += 1;
  const revenge = !!state.review[n];
  if (revenge) { delete state.review[n]; state.stars += 1; }   // おぼえなおして せいかい: ボーナス
  if (state.miss[n]) state.miss[n] = Math.max(0, state.miss[n] - 1);
  save(); renderZukan();
  cheer(Object.keys(state.got).length === TOTAL && state.got[n] === 1 ? "🏆 ぜんぶ そろった!"
    : evolved ? `${STAGES[stageIdx(Object.keys(state.got).length)].e} しんか!`
    : revenge ? "🔁⭐ リベンジ せいこう!" : "⭐");
  if (revenge) setTimeout(sfx.sparkle, 300);
  if (evolved) { speak("しんか!"); sfx.evolve(); }
  setTimeout(newQuestion, 900);
}

function applySettings() {
  document.querySelectorAll('input[name="lv"]').forEach(r => { r.checked = +r.value === state.set.level; });
  $("optAuto").checked = state.set.autoDemo; $("optQ").checked = state.set.quality; $("optDbg").checked = state.set.debug;
  $("dbg").classList.toggle("hidden", !state.set.debug);
  $("optSnd").checked = state.set.sound; $("sndBtn").textContent = state.set.sound ? "🔊" : "🔇";
}
$("gear").addEventListener("click", () => { sfx.tap(); $("panel").classList.toggle("hidden"); });
$("sndBtn").addEventListener("click", () => { state.set.sound = !state.set.sound; save(); applySettings(); sfx.tap(); });
$("optSnd").addEventListener("change", e => { state.set.sound = e.target.checked; save(); applySettings(); sfx.tap(); });
document.querySelectorAll('input[name="lv"]').forEach(r => r.addEventListener("change", () => { state.set.level = +r.value; save(); }));
$("optAuto").addEventListener("change", e => { state.set.autoDemo = e.target.checked; save(); });
$("optQ").addEventListener("change", e => { state.set.quality = e.target.checked; save(); });
$("optDbg").addEventListener("change", e => { state.set.debug = e.target.checked; save(); applySettings(); });
let resetArmed = null;           // スマホの ひょうじでは confirm() が つかえないので 2かい おして けす
$("resetBtn").addEventListener("click", () => {
  const b = $("resetBtn");
  if (!resetArmed) {
    b.textContent = "ほんとうに けす? もういちど おす";
    resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "きろくを ぜんぶ けす"; }, 4000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = "きろくを ぜんぶ けす";
  state.stars = 0; state.got = {}; state.miss = {}; state.review = {}; state.qn = 0; save(); renderZukan(); newQuestion();
});
applySettings();

// ---- きろくの コード(コピーして とっておく / あとで もどす) ----
function makeCode() {
  const o = { v: 1, stars: state.stars, got: state.got, miss: state.miss, review: state.review, qn: state.qn };
  return "KJ1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function mergeCode(code) {          // いまの きろくに あわせる(あたらしいほうを のこす)。できなければ false
  const m = String(code).match(/KJ1:([A-Za-z0-9+/=]+)/);
  if (!m) return false;
  let o; try { o = JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { return false; }
  if (!o || typeof o !== "object" || typeof o.got !== "object") return false;
  const num = (x, hi) => (Number.isFinite(+x) ? Math.max(0, Math.min(hi, Math.floor(+x))) : 0);
  for (const k in o.got) { const n = +k, v = num(o.got[k], 9999); if (n >= 1 && n <= TOTAL && v > 0) state.got[n] = Math.max(state.got[n] || 0, v); }
  for (const k in (o.miss || {})) { const n = +k; if (n >= 1 && n <= TOTAL) state.miss[n] = Math.max(state.miss[n] || 0, num(o.miss[k], 99)); }
  for (const k in (o.review || {})) {
    const n = +k, v = o.review[k];
    if (n >= 1 && n <= TOTAL && v && !state.review[n]) state.review[n] = { at: num(v.at, 1e9), fails: num(v.fails, 99) || 1 };
  }
  state.stars = Math.max(state.stars, num(o.stars, 1e6));
  state.qn = Math.max(state.qn, num(o.qn, 1e9));
  save(); renderZukan(); applySettings();
  return true;
}
$("codeMake").addEventListener("click", () => { $("codeOut").value = makeCode(); $("codeOut").classList.remove("hidden"); $("codeCopy").classList.remove("hidden"); $("codeMsg").textContent = "コードが できたよ。コピーして メモや メッセージに とっておいてね"; });
$("codeCopy").addEventListener("click", async () => {
  const t = $("codeOut"); t.select();
  try { await navigator.clipboard.writeText(t.value); $("codeMsg").textContent = "コピーしたよ!"; }
  catch (e) { $("codeMsg").textContent = "コードを ながおしで えらんで コピーしてね"; }
});
$("codeApply").addEventListener("click", () => {
  const ok = mergeCode($("codeIn").value);
  $("codeMsg").textContent = ok ? `もどしたよ! ずかん ${Object.keys(state.got).length}字` : "コードが ただしくないよ。さいしょの「KJ1:」から ぜんぶ はりつけてね";
  if (ok) { $("codeIn").value = ""; newQuestion(); }
});
function showStatus() {
  const t = state.savedAt ? new Date(state.savedAt).toLocaleString("ja-JP") : "まだ";
  $("saveStatus").textContent = storageOK ? `ほぞん: OK(さいごの ほぞん ${t})` : "ほぞん: できません(この がめんでは きろくが のこりません)";
  $("storageWarn").classList.toggle("hidden", storageOK);
}
$("gear").addEventListener("click", showStatus);
// localStorage が からっぽで IndexedDB に ひかえが あれば ふっかつ
if (!hadSaved) idbGet().then(v => {
  if (!v) return;
  try {
    const o = JSON.parse(v);
    if (!o || !o.got || !Object.keys(o.got).length) return;
    Object.assign(state, o);
    state.set = Object.assign({ level: 1, autoDemo: true, quality: true, debug: false, sound: true }, o.set || {});
    save(); renderZukan(); applySettings(); newQuestion();
  } catch (e) {}
});
showStatus();

function setMode(m) { sfx.tap(); state.mode = m; save(); renderZukan(); newQuestion(); }
$("tabCalc").addEventListener("click", () => setMode("calc"));
$("tabOpp").addEventListener("click", () => setMode("opp"));
$("tabNat").addEventListener("click", () => setMode("nat"));
$("tabRead").addEventListener("click", () => setMode("read"));
$("tabSent").addEventListener("click", () => setMode("sent"));
$("tabMix").addEventListener("click", () => setMode("mix"));

renderZukan();
newQuestion();
</script>
</body>
</html>
